/* ---------- Styles in Setup ---------- */
function perOpts(st,cur){const v=+cur||st.def;const has=st.lens.some(([s])=>s===v);return st.lens.map(([s,l])=>`<option value="${s}" ${(has?v:st.def)===s?'selected':''}>${esc(l)}</option>`).join('')}
function perHint(st){return st.fam==='uww'?`Two periods. Technical superiority at ${st.ts} points. Ties go to criteria: biggest move, fewest cautions, last point.`
  :st.rt?'Riding time: 1 point for 1:00 or more of advantage. Overtime: 1:00 sudden victory, two 0:30 tiebreakers, 1:00 sudden victory, then an ultimate tiebreaker.'
  :'Overtime: 1:00 sudden victory, two 0:30 tiebreakers, then a 0:30 ultimate tiebreaker.'}
function rtHTML(T){const d=T.rtAdv||0;if(!d)return 'Riding time <b class="mono">0:00</b>';const s=d>0?'a':'b';const v=Math.abs(d);
  return `Riding time <b class="${s==='a'?'wg':'wr'} mono">${SIDE[s]} +${ENGINE.mmss(v)}</b>${v>=60?' <span class="rtpt">1 point</span>':''}`}

/* ---------- Estimated times: the schedule re-run from how fast each mat is actually going ---------- */
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function minOfAt(at){const d=new Date(at);return d.getHours()*60+d.getMinutes()+d.getSeconds()/60}
function sameDayAt(at){return !!at&&ymd(new Date(at))===S.event.date}
function liveFrac(l){const P=PER();let s=0;for(let i=0;i<l.p&&i<P.length;i++)s+=P[i].sec;s+=elapsedOf(l,l.sec||120);const reg=P.filter(x=>x.kind==='reg').reduce((a,x)=>a+x.sec,0);return Math.min(1,s/reg)}
function project(){if(!C)return;const ev=S.event,dur=Math.max(1,+ev.boutMinutes||6),rest=Math.max(0,+ev.restMinutes||0);
  const today=!!ev.date&&ev.date===ymd(new Date());const now=minOfAt(Date.now());C.today=today;C.pace={};
  const byMat={};C.sched.forEach(b=>(byMat[b.mat]=byMat[b.mat]||[]).push(b));const free={},started={};
  Object.entries(byMat).forEach(([m,list])=>{const ts=list.filter(b=>b.result&&!b.result.auto&&sameDayAt(b.result.at)).map(b=>minOfAt(b.result.at)).sort((p,q)=>p-q);
    const gaps=[];const last=ts.slice(-10);for(let i=1;i<last.length;i++){const g=last[i]-last[i-1];if(g>.5&&g<dur*4)gaps.push(g)}gaps.sort((p,q)=>p-q);
    C.pace[m]=gaps.length>=2?Math.min(dur*2.5,Math.max(dur*.5,gaps[Math.floor(gaps.length/2)])):dur;
    started[m]=ts.length>0;free[m]=today?Math.max(now,ts.length?ts[ts.length-1]:-1e9):-1e9});
  const end={};const srcEnd=(x,s)=>{if(s.t==='S')return -Infinity;const b=x.br.byKey[s.k];if(b.real){const e=end[x.w.id+'~'+b.key];return e==null?-Infinity:e}return Math.max(srcEnd(x,b.a),srcEnd(x,b.b))};
  C.sched.forEach(b=>{const x=C.byW[b.wid],id=b.wid+'~'+b.key;b.live=false;
    if(!today){b.proj=b.start;end[id]=b.end;return}
    if(b.result){b.proj=null;end[id]=!b.result.auto&&sameDayAt(b.result.at)?minOfAt(b.result.at):Math.min(b.end,now);return}
    const pace=C.pace[b.mat],l=liveFor(b.wid,b.key);
    if(l){b.live=true;b.proj=now;end[id]=now+Math.max(1,(1-liveFrac(l))*pace);free[b.mat]=Math.max(free[b.mat],end[id]);return}
    let s=Math.max(free[b.mat],Math.max(srcEnd(x,b.a),srcEnd(x,b.b))+rest,now);if(b.finalsSession||!started[b.mat])s=Math.max(s,b.start);
    b.proj=s;end[id]=s+pace;free[b.mat]=end[id]});
  C.projEnd=end}
function projEnd(b){return C&&C.projEnd&&C.projEnd[b.wid+'~'+b.key]!=null?C.projEnd[b.wid+'~'+b.key]:b.end}
function estOf(b){return !b.result&&C&&C.today&&b.proj!=null?b.proj:b.start}
function estHTML(b){const e=estOf(b);if(Math.abs(e-b.start)<5)return fmtT(b.start);return `<span class="est ${e>b.start?'late':'early'}" title="Scheduled ${fmtT(b.start)}">Est. ${fmtT(e)}</span>`}
function lateTxt(d){d=Math.abs(d);return d>=60?Math.floor(d/60)+'h '+(d%60)+'m':d+' min'}
function matLate(m){const up=matQueue(m).find(o=>!o.b.result);return up&&C.today&&up.b.proj!=null?Math.round(up.b.proj-up.b.start):0}
setInterval(()=>{if(!C||!C.today||SB||M)return;project();const ae=document.activeElement;if(ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName))return;if(['mats','sheet','calls','follow','live','brackets'].includes(S.view))render()},60000);

/* ---------- One scoring device per mat ---------- */
const LOCK_MS=45000;
function lockOf(m){if(S.mode!=='db')return null;const l=S.locks['m'+m];return l&&l.dev!==DEV&&Date.now()-(l.at||0)<LOCK_MS?l:null}
function claimMat(beat){if(S.mode!=='db'||!SB)return;if(!beat)SB.claimAt=Date.now();Store.setLock(SB.mat,{dev:DEV,at:Date.now(),wid:SB.wid,key:SB.key})}
function locksChanged(){if(SB&&!SB.blocked&&S.mode==='db'){const l=S.locks['m'+SB.mat];if(l&&l.dev!==DEV&&(l.at||0)>=(SB.claimAt||0)){SB.blocked={at:l.at,taken:true};SB.pane=null;paintSB();toast('Another device took over Mat '+SB.mat+'. This scoreboard is now read-only.')}}
  if(S.view==='live'&&!SB)render()}

/* ---------- Mats ---------- */
function matQueue(m){return C.sched.filter(b=>b.mat===m).map(b=>({b,x:C.byW[b.wid]}))}
function ready(b){return b.pa&&b.pb&&b.pa!=='BYE'&&b.pb!=='BYE'}
function callBtn(o,k,m){if(S.readOnly||!ready(o.b))return '';return `<button class="btn" data-act="call" data-w="${esc(o.x.w.id)}" data-k="${o.b.key}" data-c="${k}" data-m="${m}">${S.calls[o.x.w.id+'~'+o.b.key]?'Call again':'Call to mat'}</button>`}
function callTag(b){const c=S.calls[b.wid+'~'+b.key];if(!c||b.result)return '';const ago=Math.max(0,Math.round((Date.now()-c.at)/60000));return `<span class="calltag">Called${c.n>1?' ×'+c.n:''} · ${ago?ago+' min ago':'just now'}</span>`}
function viewMats(){const mats=Math.max(1,parseInt(S.event.mats)||1);if(S.mat>mats)S.mat=1;
  const chips=[];for(let m=1;m<=mats;m++){const q=matQueue(m);const nx=q.find(o=>!o.b.result);const dl=matLate(m);
    chips.push(`<button class="pill" data-act="pickMat" data-m="${m}" aria-pressed="${m===S.mat}">Mat ${m}<small>${nx?'next #'+nx.b.num:'done'}${dl>=5?` · ${lateTxt(dl)} behind`:dl<=-5?` · ${lateTxt(dl)} ahead`:''}</small></button>`)}
  const q=matQueue(S.mat),dl=matLate(S.mat),up=q.filter(o=>!o.b.result);const pace=C.pace&&C.pace[S.mat];
  const card=(o,k,cls,ck)=>{if(!o)return `<div class="mcard"><div class="k"><span class="label">${k}</span></div><div class="sub" style="color:var(--muted)">Nothing scheduled</div></div>`;const {b,x}=o;const e=estOf(b);
    return `<div class="mcard ${cls}"><div class="k"><span class="label">${k}</span><span class="num">Bout #${b.num}</span></div><div class="wt">${esc(x.w.label)}<small>${esc(b.label)}</small></div>
    <div class="vs">${sideHTML(x,b,'a')}${sideHTML(x,b,'b')}</div><div class="times"><span>Scheduled <b>${fmtT(b.start)}</b></span>${Math.abs(e-b.start)>=5?`<span>Estimated <b class="${e>b.start?'late':''}">${fmtT(e)}</b></span>`:''}${callTag(b)}</div>
    ${(()=>{const l=liveFor(x.w.id,b.key);return l?liveStrip(l):''})()}
    ${!ready(b)?'<button class="btn" disabled>Waiting on earlier bout</button>':`<div class="row">${S.readOnly?'':`<button class="btn ${cls==='now'?'primary':''}" data-act="score" data-w="${esc(x.w.id)}" data-k="${b.key}">Score bout</button>`}<button class="btn" data-act="bout" data-w="${esc(x.w.id)}" data-k="${b.key}">${S.readOnly?'Details':'Enter result only'}</button>${ck?callBtn(o,ck,S.mat):''}</div>`}</div>`};
  const rows=q.map(({b,x})=>`<tr class="clickable ${b.result?'done':''}" data-act="bout" data-w="${esc(x.w.id)}" data-k="${b.key}"><td class="mono">${b.num}</td><td class="mono">${fmtT(b.start)}</td><td class="mono">${!b.result&&C.today&&Math.abs(estOf(b)-b.start)>=1?fmtT(estOf(b)):''}</td><td><b>${esc(x.w.label)}</b></td><td>${esc(b.label)}</td><td class="wg">${esc(b.pa&&b.pa!=='BYE'?wName(x,b.pa):srcLabel(x,b.a))}</td><td class="wr">${esc(b.pb&&b.pb!=='BYE'?wName(x,b.pb):srcLabel(x,b.b))}</td><td>${b.result?`<span class="status ok">${esc(wName(x,b.winnerId))} · ${esc(resultText(b.result))}${b.result.auto?' (withdrawn)':''}</span>`:b.stale?'<span class="status up">Re-enter</span>':b.dbl?'<span class="status up">Both withdrawn</span>':''}</td></tr>`).join('');
  return `<div class="pills">${chips.join('')}</div>
   ${dl>=5?`<div class="banner warn"><b>Mat ${S.mat} is running about ${lateTxt(dl)} behind.</b> Estimated times below are re-figured from how fast bouts are actually going${pace?` (about ${Math.round(pace*10)/10} minutes each on this mat)`:''}.</div>`:''}
   <div class="matgrid">${card(up[0],'On the mat','now','now')}${card(up[1],'On deck','','deck')}${card(up[2],'In the hole','','hole')}</div>
   <section class="panel"><div class="panel-h"><h2>Mat ${S.mat} bout order</h2><span class="sub">${q.length} bouts · ${q.length-up.length} complete</span><span class="spacer"></span><button class="btn" data-act="printCards">Print bout cards</button></div>
   <div class="tscroll"><table><thead><tr><th>Bout</th><th>Time</th><th>Est.</th><th>Wt</th><th>Round</th><th>Green</th><th>Red</th><th>Result</th></tr></thead><tbody>${rows||'<tr><td colspan="8">No bouts on this mat.</td></tr>'}</tbody></table></div></section>`}

/* ---------- Calls (announcer table) ---------- */
let SPEAK=(()=>{try{return localStorage.getItem('matside-speak')==='1'}catch(e){return false}})();
function announceText(o,k,m){const {b,x}=o;const n=id=>{const w=x.wmap[id]||{};return (w.name||'')+(w.school?' of '+w.school:'')};
  return `${k==='now'?'Now on mat '+m:k==='deck'?'On deck, mat '+m:'In the hole, mat '+m}. Bout ${b.num}, ${x.w.label}${/^\d+$/.test(x.w.label)?' pounds':''}. ${n(b.pa)}, and ${n(b.pb)}.`}
function speak(t){try{if(!window.speechSynthesis)return false;const u=new SpeechSynthesisUtterance(t);u.rate=.95;speechSynthesis.speak(u);return true}catch(e){return false}}
function matSlots(m){const q=matQueue(m).filter(o=>!o.b.result);const l=S.live['m'+m];const act=liveActive(l);let now=q[0]||null,rest=q.slice(1);
  if(act){const i=q.findIndex(o=>o.x.w.id===l.wid&&o.b.key===l.key);if(i>=0){now=q[i];rest=q.filter((_,j)=>j!==i)}}
  return {now,deck:rest[0]||null,hole:rest[1]||null,live:act?l:null}}
function viewCalls(){const mats=Math.max(1,parseInt(S.event.mats)||1);const cell=(o,k,m,l)=>{if(!o)return `<td class="cc empty">${k==='now'?'Mat clear':'Nothing scheduled'}</td>`;const {b,x}=o;
    const nm=s=>{const id=s==='a'?b.pa:b.pb;return id&&id!=='BYE'?`<b>${esc(wName(x,id))}</b> <span class="sc">${esc((x.wmap[id]||{}).school||'')}</span>`:`<i class="sc">${esc(srcLabel(x,s==='a'?b.a:b.b))}</i>`};
    return `<td class="cc"><div class="cch"><b>#${b.num}</b> ${esc(x.w.label)} · ${esc(b.label)}<span class="spacer"></span>${k==='now'&&l?`<span class="lvtag"><i class="ldot"></i>LIVE ${l.sa}–${l.sb}</span>`:estHTML(b)}</div>
     <div class="ccn"><span class="wg">G</span> ${nm('a')}</div><div class="ccn"><span class="wr">R</span> ${nm('b')}</div>
     <div class="row">${callTag(b)}<span class="spacer"></span>${k==='now'&&l?'':callBtn(o,k,m)}</div></td>`};
  const rows=[];for(let m=1;m<=mats;m++){const s=matSlots(m);rows.push(`<tr><th class="cm">Mat ${m}${matLate(m)>=5?`<small class="late">${lateTxt(matLate(m))} behind</small>`:''}</th>${cell(s.now,'now',m,s.live)}${cell(s.deck,'deck',m)}${cell(s.hole,'hole',m)}</tr>`)}
  return `<section class="panel"><div class="panel-h"><h2>Calls</h2><span class="sub">What every mat has now, on deck and in the hole. Calling a bout marks it on every screen so wrestlers and coaches see "Called".</span><span class="spacer"></span>
   <label class="row" style="gap:6px"><input type="checkbox" id="speakOn" ${SPEAK?'checked':''}> Read calls aloud</label>${S.readOnly?'':'<button class="btn primary" data-act="callAll">Call every on-deck bout</button>'}</div>
   <div class="tscroll"><table class="calls"><thead><tr><th></th><th>On the mat</th><th>On deck</th><th>In the hole</th></tr></thead><tbody>${rows.join('')}</tbody></table></div></section>`}
function doCall(wid,key,k,m){const x=C.byW[wid];const b=x&&x.br.byKey[key];if(!b||!ready(b))return;const id=wid+'~'+key;const prev=S.calls[id];
  Store.setCall(id,{at:Date.now(),n:((prev&&prev.n)||0)+1,m:+m,k}).catch(()=>{});if(SPEAK)speak(announceText({b,x},k,m))}

/* ---------- Live and TV ---------- */
function liveActive(l){return !!(l&&!l.fin&&Date.now()-(l.at||0)<45*60000)}
function posWord(l,s){if(!l.pos||l.pos==='N'||(l.style&&ENGINE.STYLES[l.style]&&ENGINE.STYLES[l.style].fam==='uww'))return '';return l.pos===s?'Top':'Bottom'}
function rtWord(l){if(!l.rt)return '';const s=l.rt>0?'a':'b';return `<span class="${s==='a'?'wg':'wr'}">RT +${ENGINE.mmss(Math.abs(l.rt))}</span>`}
function slotName(x,b,s){const id=s==='a'?b.pa:b.pb;return id&&id!=='BYE'?wName(x,id):srcLabel(x,s==='a'?b.a:b.b)}
function miniBout(o){if(!o)return '';const {b,x}=o;return `#${b.num} · ${esc(x.w.label)} · <span class="wg">${esc(slotName(x,b,'a'))}</span> v <span class="wr">${esc(slotName(x,b,'b'))}</span>`}
function viewLive(){const mats=Math.max(1,parseInt(S.event.mats)||1);const tiles=[];
  for(let m=1;m<=mats;m++){const l=S.live['m'+m];const sl=matSlots(m);const active=!!sl.live;
    const deck=active?sl.deck:sl.deck;const lk=lockOf(m);
    if(active){const posA=posWord(l,'a'),posB=posWord(l,'b');
      tiles.push(`<div class="ltile on"><div class="lt-h"><span class="lt-m">Mat ${m}</span><span class="sub">#${l.num} · ${esc(l.w)} · ${esc(l.round)}</span></div>
       <div class="lt-row g"><i class="band g"></i><div class="nmb"><span class="nm">${esc(l.an)}</span><span class="sc">${esc(l.as)}${posA?' · '+posA:''}</span></div><b class="lt-s">${l.sa}</b></div>
       <div class="lt-row r"><i class="band r"></i><div class="nmb"><span class="nm">${esc(l.bn)}</span><span class="sc">${esc(l.bs)}${posB?' · '+posB:''}</span></div><b class="lt-s">${l.sb}</b></div>
       <div class="lt-f"><span>${esc(l.pl)} ${rtWord(l)}</span><span class="mono lt-c ${l.since?'run':''}" data-lc="m${m}">${liveClock(l)}</span></div>
       ${deck?`<div class="lt-n"><span class="label">On deck</span> ${miniBout(deck)} ${callTag(deck.b)}</div>`:''}
       <div class="row">${S.readOnly?'':`<button class="btn" data-act="score" data-w="${esc(l.wid)}" data-k="${esc(l.key)}">${lk?'Scored on another device':'Open scoreboard'}</button>`}<button class="btn" data-act="tv" data-m="${m}">TV</button></div></div>`)}
    else{const nx=sl.now;tiles.push(`<div class="ltile"><div class="lt-h"><span class="lt-m">Mat ${m}</span><span class="sub">${l&&l.fin?'Last: '+esc(l.fin):'Not scoring live'}</span></div>
       ${nx?`<div class="sub">Up next · #${nx.b.num} · ${esc(nx.x.w.label)} · ${esc(nx.b.label)} · ${estHTML(nx.b)} ${callTag(nx.b)}</div><div class="vs">${sideHTML(nx.x,nx.b,'a')}${sideHTML(nx.x,nx.b,'b')}</div>
       ${sl.deck?`<div class="lt-n"><span class="label">On deck</span> ${miniBout(sl.deck)}</div>`:''}
       <div class="row">${S.readOnly?'':`<button class="btn primary" data-act="score" data-w="${esc(nx.x.w.id)}" data-k="${nx.b.key}" ${ready(nx.b)?'':'disabled'}>Score this bout</button>`}<button class="btn" data-act="tv" data-m="${m}">TV</button></div>`:'<div class="sub">All bouts on this mat are done.</div>'}</div>`)}}
  return `<section class="panel"><div class="panel-h"><h2>Live mats</h2><span class="sub">Scores and clocks update the moment the mat table scores. Put this on a gym screen or follow along on a phone. TV opens one mat full screen.</span><span class="spacer"></span><button class="btn" data-act="fullscreen">Full screen</button></div><div class="panel-b"><div class="lgrid">${tiles.join('')}</div></div></section>`}
let TV=null;
function openTV(m){TV={m:+m};document.body.classList.add('tvopen');paintTV();try{const el=document.documentElement;if(el.requestFullscreen&&!document.fullscreenElement)el.requestFullscreen().catch(()=>{})}catch(e){}}
function closeTV(){TV=null;document.body.classList.remove('tvopen');$('#tvRoot').innerHTML='';try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){}}
function paintTV(){const root=$('#tvRoot');if(!TV||!C){root.innerHTML='';return}const mats=Math.max(1,parseInt(S.event.mats)||1);if(TV.m>mats)TV.m=1;const m=TV.m;const sl=matSlots(m);const l=sl.live;
  const nav=`<div class="tvnav"><button class="btn" data-act="tvPrev" aria-label="Previous mat">‹</button><span>Mat ${m} of ${mats}</span><button class="btn" data-act="tvNext" aria-label="Next mat">›</button><button class="btn" data-act="tvClose">Exit TV</button></div>`;
  let body;
  if(l){body=`<div class="tvh"><span class="tvmat">Mat ${m}</span><span>Bout #${l.num} · ${esc(l.w)} · ${esc(l.round)}</span></div>
    <div class="tvmain"><div class="tvs g"><div class="tvnm">${esc(l.an)}</div><div class="tvsc">${esc(l.as)}${posWord(l,'a')?' · '+posWord(l,'a'):''}</div><div class="tvpts">${l.sa}</div></div>
     <div class="tvc"><div class="tvper">${esc(l.pl)}</div><div class="tvclock mono ${l.since?'run':''}" data-lc="m${m}">${liveClock(l)}</div>${l.rt?`<div class="tvrt">${rtWord(l)}</div>`:''}</div>
     <div class="tvs r"><div class="tvnm">${esc(l.bn)}</div><div class="tvsc">${esc(l.bs)}${posWord(l,'b')?' · '+posWord(l,'b'):''}</div><div class="tvpts">${l.sb}</div></div></div>`}
  else if(sl.now){const {b,x}=sl.now;const w=id=>x.wmap[id]||{};
    body=`<div class="tvh"><span class="tvmat">Mat ${m}</span><span>Up next · Bout #${b.num} · ${esc(x.w.label)} · ${esc(b.label)}</span></div>
    <div class="tvmain"><div class="tvs g"><div class="tvnm">${esc(slotName(x,b,'a'))}</div><div class="tvsc">${esc(w(b.pa).school||'')}</div></div><div class="tvc"><div class="tvper">Starts</div><div class="tvclock mono">${fmtT(estOf(b))}</div></div><div class="tvs r"><div class="tvnm">${esc(slotName(x,b,'b'))}</div><div class="tvsc">${esc(w(b.pb).school||'')}</div></div></div>`}
  else body=`<div class="tvh"><span class="tvmat">Mat ${m}</span><span>${l&&l.fin?'Last: '+esc(l.fin):'All bouts on this mat are done'}</span></div><div class="tvmain"></div>`;
  const foot=[sl.deck?`<span><b>On deck</b> ${miniBout(sl.deck)}</span>`:'',sl.hole?`<span><b>In the hole</b> ${miniBout(sl.hole)}</span>`:''].join('');
  root.innerHTML=`<div class="tv" role="dialog" aria-modal="true" aria-label="Mat ${m} scoreboard">${body}<div class="tvfoot">${foot}</div>${nav}</div>`}
document.addEventListener('keydown',e=>{if(!TV)return;if(e.key==='Escape')closeTV();else if(e.key==='ArrowRight'){TV.m=TV.m%Math.max(1,parseInt(S.event.mats)||1)+1;paintTV()}else if(e.key==='ArrowLeft'){const n=Math.max(1,parseInt(S.event.mats)||1);TV.m=(TV.m+n-2)%n+1;paintTV()}});

/* ---------- Wrestlers: search and follow ---------- */
let FOLLOW=(()=>{try{return new Set(JSON.parse(localStorage.getItem('matside-follow'+EVK)||'[]'))}catch(e){return new Set()}})();
function saveFollow(){try{localStorage.setItem('matside-follow'+EVK,JSON.stringify([...FOLLOW]))}catch(e){}}
function ord(n){n=+n;return n+(['th','st','nd','rd'][(n%100-20)%10]||['th','st','nd','rd'][n%100]||'th')}
function wInfo(x,id){const bouts=x.br.bouts.filter(b=>b.real&&(b.pa===id||b.pb===id));const past=bouts.filter(b=>b.result).sort((p,q)=>p.num-q.num);
  const next=bouts.filter(b=>!b.result&&!b.dbl).sort((p,q)=>p.num-q.num)[0]||null;const wins=past.filter(b=>b.winnerId===id).length;const pl=ENGINE.placesFor(x);const place=Object.keys(pl).find(p=>pl[p]===id);
  const w=x.wmap[id]||{};let status;
  if(w.status)status={scratch:'Scratched',mff:'Medical forfeit',dq:'Removed from the tournament'}[w.status];
  else if(next)status='Alive';else if(place)status=ord(place)+' place';else if(x.br.n<2)status=x.br.n===1?'Champion (only entry)':'';else status=past.length?'Done for the day':'Not wrestled yet';
  return {past,next,wins,losses:past.length-wins,place,status}}
function followCard(x,w){const i=wInfo(x,w.id);const b=i.next;let nx='';
  if(b){const opp=b.pa===w.id?b.pb:b.pa,oppSrc=b.pa===w.id?b.b:b.a;const l=liveFor(x.w.id,b.key);const c=S.calls[x.w.id+'~'+b.key];
    nx=`<div class="fnext ${l?'on':''}"><div class="label">${l?'Wrestling now':c?'Called: report to Mat '+b.mat:'Next bout'}</div>
     <div><b>#${b.num}</b> · Mat ${b.mat} · ${esc(b.label)} · ${l?'':estHTML(b)}</div>
     <div>vs ${opp&&opp!=='BYE'?`<b>${esc(wName(x,opp))}</b> <span class="sc">${esc((x.wmap[opp]||{}).school||'')}</span>`:`<i class="sc">${esc(srcLabel(x,oppSrc))}</i>`}</div>
     ${l?liveStrip(l):''}</div>`}
  const past=i.past.map(b=>{const won=b.winnerId===w.id;const opp=b.pa===w.id?b.pb:b.pa;return `<li><span class="${won?'wg':'wr'}">${won?'W':'L'}</span> ${esc(resultText(b.result))} ${won?'over':'to'} ${esc(wName(x,opp))} <span class="sc">${esc(b.label)}</span></li>`}).join('');
  return `<div class="fcard"><div class="fh"><div><div class="nm">${esc(w.name)}${w.seed>0?` <span class="seedtag">#${w.seed} seed</span>`:''}</div><div class="sc">${esc(w.school||'')} · ${esc(x.w.label)}${w.record?' · '+esc(w.record):''}</div></div>
   <button class="star" data-act="follow" data-id="${esc(w.id)}" aria-pressed="${FOLLOW.has(w.id)}" aria-label="${FOLLOW.has(w.id)?'Unfollow':'Follow'} ${esc(w.name)}">${FOLLOW.has(w.id)?'★':'☆'}</button></div>
   <div class="fst"><span class="status ${i.status==='Alive'?'ok':''}">${esc(i.status)}</span><span class="sc">This event ${i.wins}-${i.losses}</span></div>${nx}${past?`<ul class="fpast">${past}</ul>`:''}</div>`}
function followResults(){const q=(S.fq||'').trim().toLowerCase();if(q.length<2)return '<div class="sub" style="color:var(--muted)">Type at least two letters of a name or school.</div>';
  const out=[];C.Ws.forEach(x=>(x.entry.wrestlers||[]).forEach(w=>{if((w.name+' '+(w.school||'')).toLowerCase().includes(q))out.push({x,w})}));
  if(!out.length)return '<div class="sub">No wrestlers match.</div>';
  return `<table><tbody>${out.slice(0,60).map(({x,w})=>{const i=wInfo(x,w.id);return `<tr><td><button class="star" data-act="follow" data-id="${esc(w.id)}" aria-pressed="${FOLLOW.has(w.id)}" aria-label="Follow ${esc(w.name)}">${FOLLOW.has(w.id)?'★':'☆'}</button></td><td><b>${esc(w.name)}</b><div class="sc">${esc(w.school||'')}</div></td><td>${esc(x.w.label)}</td><td>${esc(i.status)}</td><td class="mono">${i.next?'#'+i.next.num+' · Mat '+i.next.mat+' · '+fmtT(estOf(i.next)):''}</td></tr>`}).join('')}</tbody></table>${out.length>60?`<div class="sub">Showing 60 of ${out.length}. Narrow the search.</div>`:''}`}
function viewFollow(){const fol=[];C.Ws.forEach(x=>(x.entry.wrestlers||[]).forEach(w=>{if(FOLLOW.has(w.id))fol.push({x,w})}));
  fol.sort((p,q)=>{const a=wInfo(p.x,p.w.id).next,b=wInfo(q.x,q.w.id).next;return (a?estOf(a):1e9)-(b?estOf(b):1e9)});
  const schools=[...new Set(C.Ws.flatMap(x=>(x.entry.wrestlers||[]).map(w=>w.school).filter(Boolean)))].sort();
  return `<section class="panel"><div class="panel-h"><h2>Following</h2><span class="sub">Your wrestlers' next bout, mat, estimated time and live score. Saved in this browser only.</span><span class="spacer"></span>
    <select class="btn" id="fwSchool" aria-label="Follow a whole team"><option value="">Follow a whole team…</option>${schools.map(s=>`<option>${esc(s)}</option>`).join('')}</select>${FOLLOW.size?'<button class="btn" data-act="unfollowAll">Clear</button>':''}</div>
   <div class="panel-b">${fol.length?`<div class="fgrid">${fol.map(({x,w})=>followCard(x,w)).join('')}</div>`:'<div class="sub" style="color:var(--muted)">Tap the star next to a wrestler below to follow them here.</div>'}</div></section>
   <section class="panel"><div class="panel-h"><h2>Find a wrestler</h2></div><div class="panel-b" style="display:grid;gap:10px"><input id="fwQ" class="btn" style="width:100%" placeholder="Name or school" value="${esc(S.fq||'')}" autocomplete="off"><div id="fwRes" class="tscroll">${followResults()}</div></div></section>`}

/* ---------- Team scores, deductions, awards, placers, exports ---------- */
function manualDeds(){return Object.entries(S.deds||{}).map(([id,d])=>Object.assign({id},d))}
function viewScores(){const t=ENGINE.teamScores(C.Ws,S.event,manualDeds());const P=Object.assign({},ENGINE.DEFAULT_POINTS,S.event.points||{});const ro=DIRECTOR()?'':'disabled';
  const rows=t.map((s,i)=>`<tr><td class="mono">${i+1}</td><td><b>${esc(s.school)}</b></td><td class="mono"><b>${fmtPts(s.total)}</b></td><td class="mono">${fmtPts(s.adv)}</td><td class="mono">${fmtPts(s.bonus)}</td><td class="mono">${fmtPts(s.place)}</td><td class="mono ${s.ded?'late':''}">${s.ded?'−'+fmtPts(s.ded):''}</td><td class="mono">${s.placers}</td><td class="mono">${s.entries}</td></tr>`).join('');
  const dl=t.flatMap(s=>s.dedList.map(d=>Object.assign({school:s.school},d)));
  const A=ENGINE.awards(C.Ws);
  const placers=C.Ws.filter(x=>x.br.n>0).map(x=>{const pl=ENGINE.placesFor(x);const maxP=Math.min(+S.event.placeTo||6,x.br.n);const li=[];for(let p=1;p<=maxP;p++){const id=pl[p];li.push(`<li><span class="pn">${ord(p)}</span> ${id?`<b>${esc(wName(x,id))}</b> <span class="sc">${esc((x.wmap[id]||{}).school||'')}</span>`:'<span class="sc">To be decided</span>'}</li>`)}return `<div class="plw"><div class="lt-m" style="font-size:20px">${esc(x.w.label)}</div><ol class="plist">${li.join('')}</ol></div>`}).join('');
  return `<section class="panel"><div class="panel-h"><h2>Team scores</h2><span class="sub">Advancement ${P.champAdv} championship / ${P.consAdv} consolation, bonus ${P.fall} fall · ${P.tf} tech fall · ${P.md} major, placement ${(P.place||[]).join(' / ')}. Change these in Setup.</span><span class="spacer"></span>
   <div class="row"><button class="btn" data-act="dlResults">Results CSV</button><button class="btn" data-act="dlPlacers">Placers CSV</button><button class="btn" data-act="dlTeams">Team scores CSV</button><button class="btn" data-act="printResults">Print results</button></div></div>
  <div class="tscroll"><table><thead><tr><th>#</th><th>School</th><th>Total</th><th>Advancement</th><th>Bonus</th><th>Placement</th><th>Deductions</th><th>Placers</th><th>Entries</th></tr></thead><tbody>${rows||'<tr><td colspan="9">No schools entered yet.</td></tr>'}</tbody></table></div></section>
  <section class="panel"><div class="panel-h"><h2>Team point deductions</h2><span class="sub">Added automatically for wrestlers removed for flagrant misconduct${+P.usDed?` and ${P.usDed} per unsportsmanlike penalty scored on the scoreboard`:''}. Add coach or bench misconduct and anything else by hand.</span></div>
   <div class="panel-b" style="display:grid;gap:12px">
    ${dl.length?`<table><tbody>${dl.map(d=>`<tr><td><b>${esc(d.school)}</b></td><td class="mono late">−${fmtPts(d.pts)}</td><td>${esc(d.reason)}</td><td>${d.id&&DIRECTOR()?`<button class="iconbtn" data-act="delDed" data-id="${esc(d.id)}" aria-label="Remove deduction">×</button>`:''}</td></tr>`).join('')}</tbody></table>`:'<div class="sub" style="color:var(--muted)">No deductions.</div>'}
    <div class="form"><label class="field"><span class="label">School</span><input id="dSchool" list="schools" ${ro}></label><label class="field"><span class="label">Team points</span><input id="dPts" type="number" min="0" step="0.5" value="1" ${ro}></label><label class="field wide"><span class="label">Reason</span><input id="dWhy" placeholder="Unsportsmanlike conduct by coach" ${ro}></label></div>
    <div class="row"><button class="btn primary" data-act="addDed" ${ro}>Add deduction</button></div></div></section>
  <section class="panel"><div class="panel-h"><h2>Awards</h2><span class="sub">Built from saved results. The Outstanding Wrestler list is a starting point for the committee's vote.</span></div>
   <div class="panel-b awards">
    <div><div class="label">Most falls, least time</div>${A.mostFalls.length?`<table><tbody>${A.mostFalls.map((p,i)=>`<tr><td class="mono">${i+1}</td><td><b>${esc(p.name)}</b><div class="sc">${esc(p.school||'')} · ${esc(p.wt)}</div></td><td class="mono">${p.falls} fall${p.falls>1?'s':''}</td><td class="mono">${ENGINE.mmss(p.fallSec)}</td></tr>`).join('')}</tbody></table>`:'<div class="sub">No falls yet.</div>'}</div>
    <div><div class="label">Fastest falls</div>${A.fastest.length?`<table><tbody>${A.fastest.map((p,i)=>`<tr><td class="mono">${i+1}</td><td><b>${esc(p.name)}</b><div class="sc">${esc(p.school||'')} · ${esc(p.wt)} · #${p.num}</div></td><td class="mono">${esc(p.time)}</td></tr>`).join('')}</tbody></table>`:'<div class="sub">No falls yet.</div>'}</div>
    <div><div class="label">Outstanding Wrestler candidates</div>${A.champs.length?`<table><tbody>${A.champs.slice(0,8).map((p,i)=>`<tr><td class="mono">${i+1}</td><td><b>${esc(p.name)}</b><div class="sc">${esc(p.school||'')} · ${esc(p.wt)}</div></td><td class="sc">${p.wins} wins · ${p.bonus} bonus · ${p.falls} F · ${p.tf} TF · ${p.seedBeat} over seeds</td></tr>`).join('')}</tbody></table>`:'<div class="sub">Appears once champions are decided.</div>'}</div>
   </div></section>
  <section class="panel"><div class="panel-h"><h2>Placers</h2></div><div class="panel-b"><div class="plgrid">${placers}</div></div></section>`}
function csvOf(rows){return rows.map(r=>r.map(v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n')}
function resultsCsv(){const rows=[['Bout','Mat','Weight','Round','Green','Green School','Red','Red School','Winner','Winner School','Loser','Loser School','Result','Type','Score','Time']];
  C.sched.forEach(b=>{const x=C.byW[b.wid];const n=id=>(id&&id!=='BYE'&&x.wmap[id])||{};const r=b.result;
    rows.push([b.num,b.mat,x.w.label,b.label,n(b.pa).name||'',n(b.pa).school||'',n(b.pb).name||'',n(b.pb).school||'',r?n(b.winnerId).name:'',r?n(b.winnerId).school:'',r?n(b.loserId).name:'',r?n(b.loserId).school:'',r?resultText(r):'',r?(ENGINE.WIN[r.type]||{}).l||r.type:'',r?r.score||'':'',r?r.time||'':''])});return csvOf(rows)}
function placersCsv(){const rows=[['Weight','Place','Name','School']];C.Ws.forEach(x=>{const pl=ENGINE.placesFor(x);Object.keys(pl).sort((a,b)=>a-b).forEach(p=>{const w=x.wmap[pl[p]]||{};rows.push([x.w.label,p,w.name||'',w.school||''])})});return csvOf(rows)}
function teamsCsv(){const t=ENGINE.teamScores(C.Ws,S.event,manualDeds());return csvOf([['Place','School','Total','Advancement','Bonus','Placement','Deductions','Placers','Entries']].concat(t.map((s,i)=>[i+1,s.school,s.total,s.adv,s.bonus,s.place,s.ded,s.placers,s.entries])))}
let DL;(async()=>{try{DL=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){DL=null}})();
function fileBase(){return (S.event.name||'tournament').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()||'tournament'}
async function saveFile(name,text,type){if(DL){try{await DL.save({filename:name,data:new Blob([text],{type})});toast('Saved '+name);return}catch(e){if(e&&(e.code==='declined'||e.code==='rate_limited'))return}}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast('Downloading '+name)}
  catch(e){try{await navigator.clipboard.writeText(text);toast('Download blocked here, so it was copied to the clipboard instead.')}catch(e2){toast('This view blocks downloads and copying.')}}}

/* ---------- Printing: brackets, bout cards, results. Printing opens the print dialog; "Save printable file" works where printing is blocked. ---------- */
function bracketPrint(x){const br=x.br;if(br.n<2)return '';const col=bs=>`<div class="bcol"><h3>${esc(bs[0].label)}</h3>${bs.map(b=>boutBox(x,b)).join('')}</div>`;
  const champ=[];for(let r=1;r<=br.R;r++)champ.push(col(br.bouts.filter(b=>b.side==='champ'&&b.round===r)));
  const cons=[...new Set(br.bouts.filter(b=>b.side==='cons').map(b=>b.round))].map(r=>col(br.bouts.filter(b=>b.side==='cons'&&b.round===r)));
  const place=br.bouts.filter(b=>b.side==='place');
  return `<div class="ppage"><h2 class="ph">${esc(S.event.name||'')} · ${esc(x.w.label)}</h2><div class="sectionlabel">Championship</div><div class="bwrap"><div class="bgrid" style="--h:${(br.N/2)*92}px">${champ.join('')}</div></div>
   ${cons.length?`<div class="sectionlabel">Consolation</div><div class="bwrap"><div class="bgrid" style="--h:${Math.max(1,br.N/4)*92}px">${cons.join('')}</div></div>`:''}
   ${place.length?`<div class="sectionlabel">Placement</div><div class="places">${place.map(b=>`<div><div class="label">${esc(b.label)}</div>${boutBox(x,b)}</div>`).join('')}</div>`:''}</div>`}
function boutCard(o){const {b,x}=o;const P=PER();const w=id=>(id&&id!=='BYE'&&x.wmap[id])||{};
  const cols=P.filter(p=>p.kind==='reg').map(p=>p.id).concat(P.st.fam==='folk'?['OT']:[]);
  return `<div class="bcard"><div class="bch"><b>Bout #${b.num}</b><span>Mat ${b.mat}</span><span>${esc(x.w.label)} · ${esc(b.label)}</span><span>${fmtT(estOf(b))}</span></div>
   <table><thead><tr><th></th><th>Wrestler</th>${cols.map(c=>`<th>${c}</th>`).join('')}<th>Total</th></tr></thead><tbody>
   <tr><td class="wg">Green</td><td><b>${esc(slotName(x,b,'a'))}</b><div class="sc">${esc(w(b.pa).school||'')}</div></td>${cols.map(()=>'<td class="box"></td>').join('')}<td class="box"></td></tr>
   <tr><td class="wr">Red</td><td><b>${esc(slotName(x,b,'b'))}</b><div class="sc">${esc(w(b.pb).school||'')}</div></td>${cols.map(()=>'<td class="box"></td>').join('')}<td class="box"></td></tr></tbody></table>
   <div class="bcf"><span>Winner ____________________</span><span>Result ________</span><span>Time ______</span><span>Ref ______</span></div></div>`}
function printDoc(title,body){return `<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>${[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n')}</style></head><body class="printing printfile"><div id="printRoot">${body}</div><script>setTimeout(function(){window.print()},400)<\/script></body></html>`}
let PRINT=null;
function showPrint(title,body){PRINT={title,body};const root=$('#modalRoot');root.innerHTML=`<div class="scrim" data-act="prClose"><div class="modal" role="dialog" aria-modal="true" aria-label="Print" data-stop><div class="mh"><div class="label">Print</div><div style="font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase">${esc(title)}</div></div>
  <div class="mb"><p class="sub" style="margin:0">Print opens your browser's print dialog. If nothing happens, this view blocks printing: save the printable file and open it instead.</p></div>
  <div class="mf"><button class="btn primary" data-act="prGo">Print</button><button class="btn" data-act="prSave">Save printable file</button><span class="spacer"></span><button class="btn" data-act="prClose">Close</button></div></div></div>`}
function doPrint(){if(!PRINT)return;const pr=$('#printRoot');pr.innerHTML=PRINT.body;document.body.classList.add('printing');$('#modalRoot').innerHTML='';
  const done=()=>{document.body.classList.remove('printing');pr.innerHTML='';window.removeEventListener('afterprint',done)};window.addEventListener('afterprint',done);
  setTimeout(()=>{try{window.print()}catch(e){}setTimeout(()=>{if(document.body.classList.contains('printing')&&!window.matchMedia('print').matches)done()},1500)},50)}
function resultsPrint(){const t=ENGINE.teamScores(C.Ws,S.event,manualDeds());
  return `<div class="ppage"><h2 class="ph">${esc(S.event.name||'')} · Team scores</h2><table><thead><tr><th>#</th><th>School</th><th>Total</th><th>Deductions</th></tr></thead><tbody>${t.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.school)}</td><td>${fmtPts(s.total)}</td><td>${s.ded?'−'+fmtPts(s.ded):''}</td></tr>`).join('')}</tbody></table></div>
   <div class="ppage"><h2 class="ph">Placers</h2><div class="plgrid">${C.Ws.filter(x=>x.br.n>0).map(x=>{const pl=ENGINE.placesFor(x);return `<div class="plw"><b>${esc(x.w.label)}</b><ol class="plist">${Object.keys(pl).sort((a,b)=>a-b).map(p=>`<li><span class="pn">${ord(p)}</span> ${esc(wName(x,pl[p]))} <span class="sc">${esc((x.wmap[pl[p]]||{}).school||'')}</span></li>`).join('')}</ol></div>`}).join('')}</div></div>`}

/* ---------- Roster import: every weight at once ---------- */
function rosterPanel(ro){return `<section class="panel"><div class="panel-h"><h2>Import a full roster</h2><span class="sub">Every weight at once. Columns: Weight, Name, School, Record, Seed. A header row in any column order is fine, and so are separate First and Last name columns. Paste from a spreadsheet or choose a CSV file.</span></div>
  <div class="panel-b" style="display:grid;gap:10px"><textarea id="roster" placeholder="Weight,Name,School,Record,Seed&#10;106,Logan Miller,Northfield,24-3,1&#10;113,Eli Brooks,Lakeview,18-6" ${ro}></textarea>
   <div class="row"><label class="btn">Choose CSV file<input type="file" id="rosterFile" accept=".csv,.txt,text/csv,text/plain" hidden ${ro}></label><label class="row" style="gap:6px"><input type="checkbox" id="rosterAddW" ${ro}> Add weight classes that aren't set up yet</label><button class="btn primary" data-act="rosterImport" ${ro}>Import roster</button></div><div id="rosterMsg" class="sub">${esc(S.rosterMsg||'')}</div></div></section>`}
function splitRow(line){if(line.includes('\t'))return line.split('\t').map(s=>s.trim());const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(q){if(ch==='"'&&line[i+1]==='"'){cur+='"';i++}else if(ch==='"')q=false;else cur+=ch}else if(ch==='"')q=true;else if(ch===','){out.push(cur.trim());cur=''}else cur+=ch}out.push(cur.trim());return out}
function parseRoster(text){const lines=text.split(/\r?\n/).map(l=>l.replace(/^﻿/,'')).filter(l=>l.trim());if(!lines.length)return [];
  let rows=lines.map(splitRow);const hd=rows[0].map(s=>s.toLowerCase());let col={wt:0,name:1,school:2,record:3,seed:4};
  if(hd.some(s=>/name|wrestler|first|last/.test(s))&&hd.some(s=>/weight|wt|class|division/.test(s))){const f=re=>hd.findIndex(s=>re.test(s));
    col={wt:f(/weight|^wt|class|division/),name:f(/^(name|wrestler|full ?name)/),first:f(/first/),last:f(/last/),school:f(/school|team|club/),record:f(/record|rec\b/),seed:f(/seed/)};rows=rows.slice(1)}
  const g=(r,i)=>i!=null&&i>=0?(r[i]||'').trim():'';
  return rows.map(r=>{const name=g(r,col.name)||[g(r,col.first),g(r,col.last)].filter(Boolean).join(' ');const w={id:newId(),name,school:g(r,col.school),record:g(r,col.record)};const sd=parseInt(g(r,col.seed));if(sd>0)w.seed=sd;return {wt:g(r,col.wt),w}}).filter(o=>o.w.name&&o.wt)}
function readRosterFile(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#roster').value=String(r.result||'');$('#rosterMsg').textContent=`Loaded ${f.name}. Check it, then press Import roster.`};r.readAsText(f)}
async function importRoster(){const list=parseRoster(($('#roster')||{}).value||'');if(!list.length){toast('Nothing to import. Include a weight and a name on each line.');return}
  const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');let ev=S.event;const byNorm={};(ev.weights||[]).forEach(w=>byNorm[norm(w.label)]=w.id);
  const missing=[...new Set(list.filter(o=>!byNorm[norm(o.wt)]).map(o=>o.wt))];
  if(missing.length&&$('#rosterAddW').checked){ev=JSON.parse(JSON.stringify(ev));missing.forEach(l=>{const id='w'+(l.replace(/[^A-Za-z0-9]/g,'')||newId());ev.weights.push({id,label:l});byNorm[norm(l)]=id});
    ev.weights.sort((a,b)=>(parseFloat(a.label)||1e9)-(parseFloat(b.label)||1e9));await Store.setEvent(ev)}
  const groups={};let skip=0,dup=0;list.forEach(o=>{const wid=byNorm[norm(o.wt)];if(!wid){skip++;return}(groups[wid]=groups[wid]||[]).push(o.w)});
  let added=0;Object.entries(groups).forEach(([wid,ws])=>{editEntry(wid,e=>{const have=new Set(e.wrestlers.map(w=>norm(w.name+'|'+(w.school||''))));
    ws.forEach(w=>{const k=norm(w.name+'|'+(w.school||''));if(have.has(k)){dup++;return}have.add(k);e.wrestlers.push(w);added++});e.draw=ENGINE.drawUnseeded(e,+S.event.placeTo||6)},true)});
  const msg=`Imported ${added} wrestler${added===1?'':'s'} into ${Object.keys(groups).length} weight${Object.keys(groups).length===1?'':'s'}.`+(dup?` Skipped ${dup} already entered.`:'')+(skip?` ${skip} row${skip===1?'':'s'} had a weight that isn't set up (${missing.join(', ')}). Tick "Add weight classes" to include them.`:'');
  S.rosterMsg=msg;toast(msg);const m=$('#rosterMsg');if(m)m.textContent=msg;const ta=$('#roster');if(ta)ta.value=''}

/* ---------- clicks for the new screens ---------- */
document.addEventListener('click',async ev=>{const t=ev.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a==='prClose'&&ev.target.closest('[data-stop]')&&!t.matches('button'))return;
  switch(a){
  case 'call':doCall(t.dataset.w,t.dataset.k,t.dataset.c,t.dataset.m);break;
  case 'callAll':{let n=0;for(let m=1;m<=Math.max(1,parseInt(S.event.mats)||1);m++){const s=matSlots(m);if(s.deck&&ready(s.deck.b)){doCall(s.deck.x.w.id,s.deck.b.key,'deck',m);n++}}toast(n?`Called ${n} on-deck bout${n>1?'s':''}.`:'No on-deck bouts are ready to call.');break}
  case 'tv':openTV(t.dataset.m);break;
  case 'tvClose':closeTV();break;
  case 'tvNext':TV.m=TV.m%Math.max(1,parseInt(S.event.mats)||1)+1;paintTV();break;
  case 'tvPrev':{const n=Math.max(1,parseInt(S.event.mats)||1);TV.m=(TV.m+n-2)%n+1;paintTV();break}
  case 'fullscreen':try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){toast('Full screen is blocked in this view. Use your browser\'s full-screen key instead.')}break;
  case 'follow':{const id=t.dataset.id;if(FOLLOW.has(id))FOLLOW.delete(id);else FOLLOW.add(id);saveFollow();render();setTimeout(()=>{const q=$('#fwQ');if(q&&S.fq&&document.activeElement===document.body){}},0);break}
  case 'unfollowAll':FOLLOW.clear();saveFollow();render();break;
  case 'addDed':{const school=($('#dSchool').value||'').trim(),pts=parseFloat($('#dPts').value),why=($('#dWhy').value||'').trim();if(!school||!(pts>0)){toast('Enter the school and the points to deduct.');return}
    Store.setDed('d'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),{school,pts,reason:why||'Team point deduction',at:Date.now()}).then(()=>toast(`Deducted ${pts} from ${school}.`));break}
  case 'delDed':Store.setDed(t.dataset.id,null).then(()=>toast('Deduction removed.'));break;
  case 'dlResults':saveFile(fileBase()+'-results.csv',resultsCsv(),'text/csv');break;
  case 'dlPlacers':saveFile(fileBase()+'-placers.csv',placersCsv(),'text/csv');break;
  case 'dlTeams':saveFile(fileBase()+'-team-scores.csv',teamsCsv(),'text/csv');break;
  case 'printW':{const x=curWeight();showPrint(x.w.label+' bracket',bracketPrint(x));break}
  case 'printAll':showPrint('All brackets',C.Ws.map(bracketPrint).join(''));break;
  case 'printCards':{const up=matQueue(S.mat).filter(o=>!o.b.result).slice(0,12);if(!up.length){toast('No bouts left on this mat.');return}showPrint(`Mat ${S.mat} bout cards`,`<div class="cards">${up.map(boutCard).join('')}</div>`);break}
  case 'printResults':showPrint('Results',resultsPrint());break;
  case 'prGo':doPrint();break;
  case 'prSave':if(PRINT){saveFile(fileBase()+'-'+PRINT.title.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.html',printDoc(PRINT.title,PRINT.body),'text/html');PRINT=null;$('#modalRoot').innerHTML=''}break;
  case 'prClose':PRINT=null;$('#modalRoot').innerHTML='';break;
  case 'rosterImport':importRoster();break;
  }});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.id==='speakOn'){SPEAK=t.checked;try{localStorage.setItem('matside-speak',SPEAK?'1':'0')}catch(e){}if(SPEAK&&!speak(''))toast('This browser cannot read aloud.')}
  if(t.id==='fwSchool'&&t.value){let n=0;C.Ws.forEach(x=>(x.entry.wrestlers||[]).forEach(w=>{if(w.school===t.value&&!FOLLOW.has(w.id)){FOLLOW.add(w.id);n++}}));saveFollow();toast(`Following ${n} more from ${t.value}.`);render()}
  if(t.id==='rosterFile')readRosterFile(t)});

paintSync();paintNet();Store.init().then(()=>{paintSync();paintNet()});
})();
</script>
</body>
</html>
