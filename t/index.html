<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Matside Brackets</title>
<meta name="description" content="Wrestling tournament brackets, bout numbers, mat-side scoring and live results.">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon-180.png">
<meta name="theme-color" content="#8f1d2f">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="../vendor/supabase.js"></script>
<script src="../vendor/qrcode.js"></script>
<script src="../config.js"></script>
<script src="../sbdb.js"></script>
<script src="../boot.js"></script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('../sw.js').catch(()=>{})</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a tournament-table console. Sticky header + tabs, then one working surface per job (brackets, mats, bout sheet, entries, scores, setup). */
:root{
  --bg:#eceff3; --surface:#ffffff; --surface-2:#f6f7f9; --ink:#141922; --muted:#5a6474; --line:#d4d9e1;
  --accent:#8f1d2f; --accent-ink:#ffffff; --accent-soft:#f6e4e7;
  --green:#1d8248; --red:#c22d2d; --gold:#a97a06; --win:#e6f4eb; --warn:#9a5b00; --warn-soft:#fff3dc;
  --f-display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1217; --surface:#161b22; --surface-2:#1c222b; --ink:#e6e9ee; --muted:#97a1af; --line:#2b323d;
  --accent:#e46a7d; --accent-ink:#1b0a0e; --accent-soft:#3a1a21;
  --green:#4cc27e; --red:#f06b6b; --gold:#e2b44b; --win:#14281c; --warn:#f0b450; --warn-soft:#33270f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1217; --surface:#161b22; --surface-2:#1c222b; --ink:#e6e9ee; --muted:#97a1af; --line:#2b323d;
  --accent:#e46a7d; --accent-ink:#1b0a0e; --accent-soft:#3a1a21;
  --green:#4cc27e; --red:#f06b6b; --gold:#e2b44b; --win:#14281c; --warn:#f0b450; --warn-soft:#33270f; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-inline:16px;max-width:1500px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px}
.mark{width:34px;height:34px;border-radius:50%;border:5px solid var(--accent);display:grid;place-items:center;flex:none}
.mark::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.ev{min-width:0;flex:1}
.ev h1{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.ev .meta{color:var(--muted);font-size:13px;margin-top:3px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.live .dot{background:var(--green)} .chip.local .dot{background:var(--gold)} .chip.ro .dot{background:var(--red)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:18px 60px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.banner.warn b{color:var(--warn)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 10px;cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:17px;display:inline-flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.pill small{font-family:var(--f-body);font-weight:500;font-size:11px;color:var(--muted)}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill[aria-pressed="true"] small{color:inherit;opacity:.8}
.pill .prog{display:inline-block;width:26px;height:4px;border-radius:2px;background:var(--line);position:relative;overflow:hidden;align-self:center}
.pill .prog i{position:absolute;inset:0 auto 0 0;background:var(--green)}
.pill[aria-pressed="true"] .prog{background:rgba(255,255,255,.35)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-family:var(--f-display);font-weight:800;font-size:24px;margin:0;text-transform:uppercase;letter-spacing:.02em}
.panel-h .sub{color:var(--muted);font-size:13px}
.panel-b{padding:16px}
.label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
/* brackets */
.bscroll{overflow-x:auto;padding:16px;padding-bottom:20px}
.bgrid{display:flex;gap:26px;min-height:var(--h)}
.bcol{display:flex;flex-direction:column;justify-content:space-around;gap:10px;width:228px;flex:none;position:relative}
.bcol h3{position:absolute;top:-2px;left:0;margin:0;transform:translateY(-100%);font-family:var(--f-display);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-bottom:4px}
.bwrap{padding-top:22px}
.bout{display:grid;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0;cursor:pointer;overflow:hidden;position:relative}
.bout:hover{border-color:var(--accent)}
.bout .bh{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--muted);padding:4px 8px;background:var(--surface-2);border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.bout .bh b{font-family:var(--f-mono);color:var(--ink);font-weight:600}
.side{display:grid;grid-template-columns:4px 18px minmax(0,1fr);align-items:center;gap:0 6px;padding:4px 8px 4px 0;min-height:30px}
.side + .side{border-top:1px dashed var(--line)}
.band{align-self:stretch;width:4px;border-radius:0 2px 2px 0}
.band.g{background:var(--green)} .band.r{background:var(--red)}
.sd{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:right}
.nmb{min-width:0;line-height:1.15}
.nm{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbd .nm{font-weight:400;color:var(--muted);font-style:italic}
.side.win{background:var(--win)}
.side.win .nm::after{content:" ✓";color:var(--green)}
.side.lose .nm{color:var(--muted);font-weight:500}
.rs{display:block;font-size:11px;padding:3px 8px;border-top:1px solid var(--line);font-family:var(--f-mono);color:var(--ink)}
.bout.stale{border-color:var(--warn)}
.bout.stale .rs{color:var(--warn)}
.bout.bye{cursor:default;opacity:.75;border-style:dashed}
.bout.bye:hover{border-color:var(--line)}
.bout.ghost{visibility:hidden;min-height:20px}
.byetag{font-size:11px;color:var(--muted);padding:3px 8px;border-top:1px dashed var(--line)}
.sectionlabel{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:15px;padding:12px 16px 0;color:var(--accent)}
.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:16px}
.podium{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;padding:0 16px 16px}
.plc{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--surface-2);min-width:0}
.plc .pn{font-family:var(--f-display);font-weight:800;font-size:22px;width:38px;flex:none;color:var(--muted)}
.plc.p1 .pn{color:var(--gold)}
.plc div{min-width:0}
/* mats */
.matgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;align-content:start}
.mcard.now{border:2px solid var(--accent)}
.mcard .k{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mcard .k .label{color:var(--accent)}
.mcard .num{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.mcard .wt{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1}
.mcard .wt small{font-size:15px;color:var(--muted);font-weight:700;margin-left:6px;letter-spacing:.03em;text-transform:uppercase}
.vs{display:grid;gap:6px}
.vs .side{border:1px solid var(--line);border-radius:var(--r);min-height:44px}
.vs .side + .side{border-top:1px solid var(--line)}
.vs .nm{font-size:16px}
.times{display:flex;gap:14px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.times b{color:var(--ink);font-weight:600}
.late{color:var(--warn)!important}
/* tables */
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0}
td.mono{font-family:var(--f-mono);font-size:13px}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface-2)}
tr.done td{color:var(--muted)}
.wg{color:var(--green);font-weight:600}
.wr{color:var(--red);font-weight:600}
.status{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.status.ok{background:var(--win);border-color:transparent;color:var(--green)}
.status.up{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
/* entries */
.entries{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.etable input{width:100%;border:1px solid transparent;background:transparent;border-radius:4px;padding:5px 6px}
.etable input:hover{border-color:var(--line)}
.etable input:focus{border-color:var(--accent);background:var(--surface);outline:none}
.etable input.seed{width:56px;text-align:center;font-family:var(--f-mono)}
.etable td{padding:3px 6px}
.iconbtn{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;padding:2px 8px;border-radius:4px}
.iconbtn:hover{color:var(--red);background:var(--surface-2)}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:8px;font-family:var(--f-mono);font-size:13px}
.warns{display:grid;gap:4px;font-size:13px}
.warns div{color:var(--warn)}
.warns div::before{content:"● ";}
/* setup */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.field{display:grid;gap:4px;min-width:0}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;width:100%}
.field .hint{font-size:12px;color:var(--muted)}
.field.wide{grid-column:1/-1}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:10px;width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;border:1px solid var(--line)}
.modal .mh{padding:16px;border-bottom:1px solid var(--line)}
.modal .mb{padding:16px;display:grid;gap:14px}
.modal .mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.pick{display:grid;gap:8px}
.pickbtn{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:10px;align-items:center;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 12px 10px 0;cursor:pointer;text-align:left}
.pickbtn .band{width:8px;height:100%}
.pickbtn[aria-pressed="true"]{border-color:var(--green);background:var(--win)}
.pickbtn .nm{font-size:17px}
.types{display:flex;gap:6px;flex-wrap:wrap}
.types button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;cursor:pointer;font-size:13px}
.types button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:var(--r);z-index:60;max-width:calc(100% - 32px);font-size:13px}
.empty{padding:40px 20px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty h2{font-family:var(--f-display);font-size:28px;margin:0;text-transform:uppercase}
.empty p{color:var(--muted);max-width:52ch;margin:0}
.kpis{display:flex;gap:28px;flex-wrap:wrap}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted)}

/* scoreboard: full-screen table console. Green left, clock center, red right; scoresheet below */
body.sbopen{overflow:hidden}
.sb{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;align-content:start}
.sbtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sbtop b{display:block;font-family:var(--f-display);font-size:24px;font-weight:800;text-transform:uppercase;line-height:1.05}
.sbmain{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,360px) minmax(0,1fr);gap:12px;align-items:start}
.sbs{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;border-top:6px solid var(--c)}
.sbs.g{--c:var(--green)} .sbs.r{--c:var(--red)}
.sbs.won{box-shadow:0 0 0 3px var(--c)}
.sbs header{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.sbs .who{display:grid;min-width:0}
.sbs .who .label{color:var(--c)}
.sbs .nm{font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.postag{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:14px;letter-spacing:.05em;padding:3px 9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(72px,11vw,150px);line-height:.9;text-align:center;color:var(--c);font-variant-numeric:tabular-nums}
.pensum{text-align:center;font-size:12px;color:var(--muted);min-height:1.2em}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.acts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.act{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 6px;cursor:pointer;display:grid;gap:2px;justify-items:center;min-height:62px;touch-action:manipulation}
.act b{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1}
.act small{font-size:11px;color:var(--muted);text-align:center}
.act:hover{border-color:var(--c)}
.act:active{transform:translateY(1px)}
.act.dim{opacity:.55}
.act.pen b{font-size:20px} .act.fall b{font-size:20px;color:var(--c)}
.act:disabled{opacity:.35;cursor:not-allowed}
.tmrs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tbtn{border:1px dashed var(--line);background:none;border-radius:6px;padding:5px 4px;cursor:pointer;display:grid;justify-items:center;font-size:11px;color:var(--muted)}
.tbtn b{font-family:var(--f-mono);font-size:14px;color:var(--ink)}
.tbtn.over b{color:var(--red)}
.sbwarn{font-size:13px;background:var(--warn-soft);color:var(--ink);border-radius:6px;padding:8px 10px}
.sbc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;justify-items:center;text-align:center}
.sbc .per{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.sbc .per small{color:var(--accent);font-size:15px}
.clock{font-size:clamp(56px,8vw,88px);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.clock.run{color:var(--accent)}
.clockrow{display:flex;gap:8px;align-items:center}
.startbtn{font-size:20px;padding:12px 26px;min-width:130px;font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.kbd{font-size:11px;color:var(--muted)}
.row.cen{justify-content:center}
.sbpane{width:100%;border:2px solid var(--accent);border-radius:8px;padding:12px;display:grid;gap:10px;text-align:left;background:var(--surface)}
.sbpane p{margin:0}
.sbpane.final{border-color:var(--fc);background:var(--win)} .sbpane.final.g{--fc:var(--green)} .sbpane.final.r{--fc:var(--red)}
.fwin{font-family:var(--f-display);font-weight:800;font-size:30px;text-transform:uppercase;line-height:1}
.fres{font-family:var(--f-display);font-weight:700;font-size:22px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px;margin-top:4px}
.seg button{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:9px 6px;cursor:pointer;font-weight:600;display:grid;gap:1px}
.seg button small{font-weight:400;color:var(--muted);font-size:11px}
.seg button.g{border-left:4px solid var(--green)} .seg button.r{border-left:4px solid var(--red)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg button[aria-pressed="true"] small{color:inherit}
.seg button:disabled{opacity:.4}
.penlist{display:grid;gap:6px}
.penlist button{display:flex;justify-content:space-between;gap:10px;align-items:baseline;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:9px 10px;cursor:pointer;text-align:left;font-weight:600}
.penlist small{font-weight:400;color:var(--muted);text-align:right}
.morelist{display:grid;gap:12px}
.btn.ghost{border-color:transparent;background:none;justify-self:start;color:var(--muted)}
.tclock{font-size:44px;font-weight:600}
.clockin{width:110px;font-size:24px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.sblog tr.sys td{color:var(--muted);font-style:italic}
.mono{font-family:var(--f-mono)}
/* live */
.ldot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:5px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.lstrip{display:flex;gap:10px;align-items:center;font-size:13px;background:var(--accent-soft);border-radius:6px;padding:6px 10px;flex-wrap:wrap}
.lstrip .mono{font-weight:600;font-size:15px}
.rs.lv{color:var(--accent);font-weight:600}

<script id="engine">
/* ===== Tournament engine: pure functions, no DOM ===== */
const DEFAULT_POINTS={champAdv:2,consAdv:1,fall:2,tf:1.5,md:1,place:[16,12,9,7,5,3,2,1],usDed:0,flagLose:1};
const WIN={F:{l:'Fall',bonus:'fall',t:true},TF:{l:'Tech Fall',bonus:'tf',s:true,t:true},MD:{l:'Major Dec',bonus:'md',s:true},DEC:{l:'Decision',s:true},SV:{l:'Sudden Victory',s:true},TB:{l:'Tiebreaker',s:true},FF:{l:'Forfeit',bonus:'fall'},MFF:{l:'Medical Forfeit',bonus:'fall'},INJ:{l:'Injury Default',bonus:'fall',t:true},DQ:{l:'Disqualification',bonus:'fall'},TS:{l:'Tech Superiority',bonus:'tf',s:true,t:true},PTS:{l:'Points',s:true}};
const WIN_BY_FAM={folk:['F','TF','MD','DEC','SV','TB','FF','MFF','INJ','DQ'],uww:['F','TS','PTS','FF','MFF','INJ','DQ']};
/* Entry status after weigh-ins: scratched and removed wrestlers forfeit their remaining bouts, medical forfeits are recorded as MFF. */
const OUT_TYPE={scratch:'FF',mff:'MFF',dq:'FF'};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seedOrder(N){let o=[1];while(o.length<N){const n=o.length*2;o=o.flatMap(s=>[s,n+1-s])}return o}
function rankWrestlers(entry){
  const ws=(entry&&entry.wrestlers)||[];
  const seeded=ws.filter(w=>w.seed>0).sort((a,b)=>a.seed-b.seed||String(a.name).localeCompare(b.name));
  const un=ws.filter(w=>!(w.seed>0)); const draw=(entry&&entry.draw)||[];
  const pos=id=>{const i=draw.indexOf(id);return i<0?1e6:i};
  un.sort((a,b)=>pos(a.id)-pos(b.id)||ws.indexOf(a)-ws.indexOf(b));
  return seeded.concat(un);
}
function buildBracket(entry,placeTo){
  const ranked=rankWrestlers(entry).slice(0,64); const n=ranked.length;
  const br={n,ranked,bouts:[],byKey:{},R:0,N:n};
  if(n<2){br.slots=ranked.map(w=>w.id);return br}
  let N=2;while(N<n)N*=2; const R=Math.log2(N); br.N=N;br.R=R;
  br.slots=seedOrder(N).map(r=>r<=n?ranked[r-1].id:null);
  const add=b=>{br.bouts.push(b);br.byKey[b.key]=b;return b};
  const W=k=>({t:'W',k}),L=k=>({t:'L',k});
  const cname=r=>{const left=R-r;return left===0?'Championship Final':left===1?'Semifinal':left===2?'Quarterfinal':'Round of '+(N/2**(r-1))};
  for(let r=1;r<=R;r++){const cnt=N/2**r;for(let j=0;j<cnt;j++){
    add({key:`C${r}-${j}`,side:'champ',round:r,idx:j,label:cname(r),final:r===R,
      a:r===1?{t:'S',i:2*j}:W(`C${r-1}-${2*j}`),b:r===1?{t:'S',i:2*j+1}:W(`C${r-1}-${2*j+1}`)})}}
  if(R===2){add({key:'P3',side:'place',idx:0,label:'3rd Place',a:L('C1-0'),b:L('C1-1')})}
  else if(R>=3){
    let c=1,cur=[];
    for(let j=0;j<N/4;j++){add({key:`K1-${j}`,side:'cons',round:1,idx:j,label:'Cons Round 1',a:L(`C1-${2*j}`),b:L(`C1-${2*j+1}`)});cur.push(`K1-${j}`)}
    let prevPair=cur.slice();
    for(let k=2;k<=R-1;k++){
      const losers=[];for(let j=0;j<N/2**k;j++)losers.push(`C${k}-${j}`);losers.reverse();
      c++;const nx=[];const lab=k===R-1?'Cons Semifinal':k===R-2?'Cons Quarterfinal':`Cons Round ${c}`;
      cur.forEach((key,j)=>{const bk=`K${c}-${j}`;add({key:bk,side:'cons',round:c,idx:j,label:lab,a:W(key),b:L(losers[j])});nx.push(bk)});
      cur=nx;
      if(k<R-1){c++;const px=[];for(let j=0;j<cur.length/2;j++){const bk=`K${c}-${j}`;add({key:bk,side:'cons',round:c,idx:j,label:`Cons Round ${c}`,a:W(cur[2*j]),b:W(cur[2*j+1])});px.push(bk)}cur=px;prevPair=px}
    }
    add({key:'P3',side:'place',idx:0,label:'3rd Place',a:W(cur[0]),b:W(cur[1])});
    if(placeTo>=6)add({key:'P5',side:'place',idx:1,label:'5th Place',a:L(cur[0]),b:L(cur[1])});
    if(placeTo>=8)add({key:'P7',side:'place',idx:2,label:'7th Place',a:L(prevPair[0]),b:L(prevPair[1])});
  }
  // structural byes and depth
  const isEmpty=s=>{if(s.t==='S')return br.slots[s.i]==null;const b=br.byKey[s.k];return s.t==='W'?(b.emptyA&&b.emptyB):(b.emptyA||b.emptyB)};
  const depth=s=>{if(s.t==='S')return 0;const b=br.byKey[s.k];return b.real?b.level:Math.max(depth(b.a),depth(b.b))};
  br.bouts.forEach(b=>{b.emptyA=isEmpty(b.a);b.emptyB=isEmpty(b.b);b.real=!b.emptyA&&!b.emptyB;b.level=1+Math.max(depth(b.a),depth(b.b))});
  return br;
}
function parseHM(s){const m=/^(\d{1,2}):(\d{2})/.exec(s||'');return m?(+m[1])*60+(+m[2]):540}
function schedule(Ws,ev){
  const mats=Math.max(1,parseInt(ev.mats)||4),dur=Math.max(1,+ev.boutMinutes||6),rest=Math.max(0,+ev.restMinutes||0),start=parseHM(ev.startTime);
  let G=0;Ws.forEach(x=>{x.maxL=0;x.br.bouts.forEach(b=>{if(b.real&&b.side!=='place'&&!b.final)x.maxL=Math.max(x.maxL,b.level)});G=Math.max(G,x.maxL)});
  const main=[],fin=[];
  Ws.forEach(x=>x.br.bouts.forEach(b=>{b.wid=x.w.id;b.wi=x.wi;b.num=null;b.start=b.end=b.mat=null;if(!b.real)return;
    if(b.side==='place'||b.final)fin.push(b);else{b.slot=b.level+(G-x.maxL);main.push(b)}}));
  const sideRank=b=>b.side==='champ'?0:1;
  main.sort((p,q)=>p.slot-q.slot||sideRank(p)-sideRank(q)||p.wi-q.wi||p.idx-q.idx);
  const pr={P7:0,P5:1,P3:2};fin.sort((p,q)=>(p.final?3:pr[p.key])-(q.final?3:pr[q.key])||p.wi-q.wi);
  const free=Array(mats).fill(start);
  const srcEnd=(x,s)=>{if(s.t==='S')return -Infinity;const b=x.br.byKey[s.k];if(b.real)return b.end==null?-Infinity:b.end;return Math.max(srcEnd(x,b.a),srcEnd(x,b.b))};
  const put=(b,mc)=>{const x=Ws[b.wi];const se=Math.max(srcEnd(x,b.a),srcEnd(x,b.b));const ready=se===-Infinity?start:se+rest;
    let best=0,bs=Infinity;for(let m=0;m<mc;m++){const s=Math.max(free[m],ready);if(s<bs){bs=s;best=m}}
    b.mat=best+1;b.start=bs;b.end=bs+dur;free[best]=b.end};
  main.forEach(b=>put(b,mats));
  if(fin.length){const fs=Math.max(start,...free)+Math.max(0,+ev.finalsBreak||0);for(let m=0;m<mats;m++)free[m]=fs;
    const fm=Math.min(mats,Math.max(1,parseInt(ev.finalsMats)||mats));fin.forEach(b=>{if(b.final)b.finalsSession=true;b.finalsSession=true;put(b,b.final?fm:mats)})}
  const all=main.concat(fin).sort((p,q)=>p.start-q.start||p.mat-q.mat||p.wi-q.wi);
  if(ev.numbering==='mat'){const per={};const cnt={};all.forEach(b=>cnt[b.mat]=(cnt[b.mat]||0)+1);const base=Math.max(...Object.values(cnt),0)>99?1000:100;
    all.forEach(b=>{per[b.mat]=(per[b.mat]||0)+1;b.num=b.mat*base+per[b.mat]})}
  else all.forEach((b,i)=>b.num=i+1);
  return all;
}
function resolveAll(x,results){
  const br=x.br;
  const res=s=>{if(s.t==='S'){const id=br.slots[s.i];return id==null?'BYE':id}const b=br.byKey[s.k];
    if(s.t==='W'){if(b.real)return b.winnerId||null;if(b.emptyA&&b.emptyB)return 'BYE';return b.emptyA?b.pb:b.pa}
    return b.real?(b.loserId||null):'BYE'};
  br.bouts.forEach(b=>{b.pa=res(b.a);b.pb=res(b.b);b.winnerId=b.loserId=null;b.result=null;b.stale=null;b.dbl=false;
    if(!b.real)return;const r=results[x.w.id+'~'+b.key];
    if(r&&b.pa&&b.pb&&r.a===b.pa&&r.b===b.pb&&(r.winner==='a'||r.winner==='b')){b.result=r;b.winnerId=r.winner==='a'?b.pa:b.pb;b.loserId=r.winner==='a'?b.pb:b.pa;return}
    if(r)b.stale=r;
    if(b.pa&&b.pb&&b.pa!=='BYE'&&b.pb!=='BYE'){const sa=OUT_TYPE[(x.wmap[b.pa]||{}).status],sb=OUT_TYPE[(x.wmap[b.pb]||{}).status];
      if(sa&&sb)b.dbl=true;else if(sa||sb){const w=sa?'b':'a';b.stale=null;b.result={a:b.pa,b:b.pb,winner:w,type:sa||sb,score:'',time:'',auto:true};b.winnerId=w==='a'?b.pa:b.pb;b.loserId=w==='a'?b.pb:b.pa}}});

const ENGINE={WIN_BY_FAM,compute,buildBracket,drawUnseeded,teamScores,awards,secOf,placesFor,makeSample,simulate,winPct,parseHM,DEFAULT_POINTS,WIN,MOVES,PENS,STYLES,styleOf,penStep,periodsFor,tally,nextPeriod,suggestedChooser,needsChoice,mmss,matchTime,otherSide};
</script>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS_KEY='matside-local-v1',PREF_KEY='matside-prefs-v1';
const S={role:'director',calls:{},locks:{},deds:{},net:'ok',event:null,entries:{},results:{},mode:'loading',readOnly:false,gotEvent:false,view:'brackets',weight:null,mat:1,filt:{mat:'',w:'',q:'',status:''},drafts:{},pendingRender:false,confirm:null,live:{},sheets:{}};
let C=null;
try{const p=JSON.parse(localStorage.getItem(PREF_KEY)||'{}');if(p.view)S.view=p.view;if(p.weight)S.weight=p.weight;if(p.mat)S.mat=p.mat}catch(e){}
const savePrefs=()=>{try{localStorage.setItem(PREF_KEY,JSON.stringify({view:S.view,weight:S.weight,mat:S.mat}))}catch(e){}};

/* ---------- storage: shared db when available, this-device storage otherwise ----------
   Every shared write goes through an outbox kept in this browser, so a dropped gym connection loses nothing:
   the latest value per document is retried until it lands, and pending values stay on screen meanwhile. */
const DEV=(()=>{try{let d=localStorage.getItem('matside-dev');if(!d){d='d'+Math.random().toString(36).slice(2,10);localStorage.setItem('matside-dev',d)}return d}catch(e){return 'd'+Math.random().toString(36).slice(2,10)}})();
const EVK=window.MATSIDE_EVENT?':'+window.MATSIDE_EVENT:'';   // keep each tournament's offline queue separate
const OB_KEY='matside-outbox-v1'+EVK,SC_KEY='matside-sheetcache-v1'+EVK;
const DIRECTOR=()=>!S.readOnly&&S.role!=='scorer';
const Store={db:null,q:{},ob:{},fl:{},rt:null,
  async init(){
    try{this.ob=JSON.parse(localStorage.getItem(OB_KEY)||'{}')||{}}catch(e){this.ob={}}

    if(db){this.db=db;S.mode='db';
      try{const user=await window.claude.use('user');if(user){const c=await user.can('data.write');if(c===false)S.readOnly=true;if(user.role)S.role=await user.role()}}catch(e){}
      const coll=(name,lim,fn)=>db.collection(name).limit(lim).onSnapshot(qs=>{const m={};qs.docs.forEach(d=>m[d.id]=d.data());this.overlay(name,m);fn(m)},e=>this.fail(e));
      db.doc('event/main').onSnapshot(s=>{const p=this.ob['event/main'];S.event=p?p.d:(s.exists?s.data():null);S.gotEvent=true;changed()},e=>this.fail(e));
      coll('entries',200,m=>{S.entries=m;changed()});
      coll('results',1000,m=>{S.results=m;changed()});
      coll('live',100,m=>{S.live=m;liveChanged()});
      coll('calls',1000,m=>{S.calls=m;liveChanged()});
      coll('locks',100,m=>{S.locks=m;locksChanged()});
      coll('deductions',300,m=>{S.deds=m;if(S.view==='scores')changed()});
      window.addEventListener('online',()=>this.flushAll());window.addEventListener('offline',()=>{S.net='off';paintNet()});
      this.flushAll();setInterval(()=>{if(Object.keys(this.ob).length)this.flushAll()},15000);
    }else{S.mode='local';this.loadLocal();if(!S.event){const s=ENGINE.makeSample(11);S.event=s.ev;S.entries=s.entries;S.results=ENGINE.simulate(s.ev,s.entries,{},0.4,5);this.saveLocal()}S.gotEvent=true;changed()}
  },
  /* Values this device wrote that the server has not confirmed yet win over what the server sends back. */
  overlay(name,m){for(const [p,it] of Object.entries(this.ob)){if(!p.startsWith(name+'/'))continue;const id=p.slice(name.length+1);if(it.d===null)delete m[id];else m[id]=it.d}},
  pending(){return Object.keys(this.ob).length},
  loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(d){S.event=d.event;S.entries=d.entries||{};S.results=d.results||{};S.sheets=d.sheets||{};S.live=d.live||{};S.calls=d.calls||{};S.deds=d.deds||{}}}catch(e){}},
  saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify({event:S.event,entries:S.entries,results:S.results,sheets:S.sheets,live:S.live,calls:S.calls,deds:S.deds}))}catch(e){toast('This browser is not saving data. Export before closing.')}},
  fail(e){if(e&&e.code==='revoked'){S.readOnly=true;paintSync()}else if(e)console.warn(e)},
  write(path,fn){const prev=this.q[path]||Promise.resolve();const p=prev.catch(()=>{}).then(fn);this.q[path]=p;return p},
  put(path,data){if(!this.db){this.saveLocal();return Promise.resolve()}
    if(S.role==='scorer'&&!/^(results|sheets|live|locks|calls)\//.test(path)){toast('Only the director can change that.');return Promise.resolve()}
    this.ob[path]={d:data==null?null:JSON.parse(JSON.stringify(data)),at:Date.now()};this.saveOb();paintNet();this.flush(path);return Promise.resolve()},
  saveOb(){try{localStorage.setItem(OB_KEY,JSON.stringify(this.ob))}catch(e){}},
  flush(path){if(!this.db||this.fl[path]||!this.ob[path])return;this.fl[path]=true;
    this.write(path,async()=>{const it=this.ob[path];if(!it)return;const at=it.at;
      if(it.d===null)await this.db.doc(path).delete();else await this.db.doc(path).set(it.d);
      if(this.ob[path]&&this.ob[path].at===at){delete this.ob[path];this.saveOb()}})

      e=>{this.fl[path]=false;const c=e&&e.code;
        if(c==='invalid_argument'||c==='transform_error'){delete this.ob[path];this.saveOb();S.readOnly=true;paintSync();toast('This link cannot make that change, so it was not saved. Ask the director.')}

  retry(){clearTimeout(this.rt);this.rt=setTimeout(()=>this.flushAll(),3000+Math.random()*3000)},

  setEvent(ev){S.event=ev;changed();return this.put('event/main',ev)},
  setEntry(wid,e){S.entries[wid]=e;changed();return this.put('entries/'+wid,e)},
  delEntry(wid){delete S.entries[wid];changed();return this.put('entries/'+wid,null)},
  setResult(id,r){S.results[id]=r;changed();return this.put('results/'+id,r)},
  delResult(id){delete S.results[id];changed();return this.put('results/'+id,null)},
  cacheSheet(id,sh){try{const c=JSON.parse(localStorage.getItem(SC_KEY)||'{}');c[id]=sh;const ks=Object.keys(c);if(ks.length>30)ks.sort((p,q)=>(c[p].at||0)-(c[q].at||0)).slice(0,ks.length-30).forEach(k=>delete c[k]);localStorage.setItem(SC_KEY,JSON.stringify(c))}catch(e){}},
  cachedSheet(id){try{return (JSON.parse(localStorage.getItem(SC_KEY)||'{}')||{})[id]||null}catch(e){return null}},
  async getSheet(id){if(!this.db)return S.sheets[id]||null;const p=this.ob['sheets/'+id];if(p)return p.d;
    try{const s=await this.db.doc('sheets/'+id).get();return s.exists?s.data():this.cachedSheet(id)}catch(e){return this.cachedSheet(id)||S.sheets[id]||null}},
  setSheet(id,sh){S.sheets[id]=sh;if(this.db)this.cacheSheet(id,sh);return this.put('sheets/'+id,sh)},
  setLive(m,l){S.live['m'+m]=l;liveChanged();return this.put('live/m'+m,l)},
  setLock(m,l){if(!this.db)return Promise.resolve();if(l)S.locks['m'+m]=l;else delete S.locks['m'+m];return this.put('locks/m'+m,l)},
  setCall(id,c){if(c)S.calls[id]=c;else delete S.calls[id];liveChanged();return this.put('calls/'+id,c)},
  setDed(id,d){if(d)S.deds[id]=d;else delete S.deds[id];changed();return this.put('deductions/'+id,d)},
  async clearScoring(){if(!this.db){S.sheets={};S.live={};S.calls={};S.deds={};this.saveLocal();return}
    try{const qs=await this.db.collection('sheets').limit(1000).get();qs.docs.forEach(d=>this.put('sheets/'+d.id,null))}catch(e){}
    for(const [k,m] of [['live',S.live],['calls',S.calls],['deductions',S.deds],['locks',S.locks]])Object.keys(m).forEach(id=>this.put(k+'/'+id,null));

  async clearResults(){const ids=Object.keys(S.results);await this.clearScoring();if(!this.db){S.results={};this.saveLocal();changed();return}ids.forEach(id=>this.delResult(id))},
  async clearAll(){const r=Object.keys(S.results),e=Object.keys(S.entries);await this.clearScoring();if(!this.db){S.results={};S.entries={};S.event=null;this.saveLocal();changed();return}
    r.forEach(id=>this.delResult(id));e.forEach(id=>this.delEntry(id));S.event=null;this.put('event/main',null);changed()}
};
function paintNet(){const n=Store.pending();const st=S.mode!=='db'?'local':(S.net==='off'||navigator.onLine===false)?'off':n?'sync':'ok';

/* ---------- helpers ---------- */
function fmtT(m){if(m==null)return '';m=Math.round(m);let h=Math.floor(m/60)%24,mm=m%60;const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+String(mm).padStart(2,'0')+' '+ap}
function fmtDate(d){if(!d)return '';const t=new Date(d+'T12:00:00');return isNaN(t)?d:t.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}
function resultText(r){if(!r)return '';const w=ENGINE.WIN[r.type]||{l:r.type};const sc=r.score?' '+r.score:'',tm=r.time?' ('+r.time+')':'';
  switch(r.type){case 'F':return 'Fall '+(r.time||'');case 'TF':return 'TF'+sc+tm;case 'MD':return 'MD'+sc;case 'DEC':return 'Dec'+sc;case 'SV':return 'SV'+sc;case 'TS':return 'TS'+sc+tm;case 'PTS':return 'Pts'+sc;case 'TB':return 'TB'+sc;case 'INJ':return 'Inj'+(r.time?' '+r.time:'');default:return w.l}}
function wName(x,id){const w=x.wmap[id];return w?w.name:''}
function srcLabel(x,s){if(s.t==='S')return 'TBD';const b=x.br.byKey[s.k];if(s.t==='W'){if(b.real)return 'Winner of #'+b.num;return b.emptyA?srcLabel(x,b.b):srcLabel(x,b.a)}return b.real?'Loser of #'+b.num:'Bye'}
function sideHTML(x,b,which){const id=which==='a'?b.pa:b.pb,src=which==='a'?b.a:b.b,band=which==='a'?'g':'r';
  const win=b.winnerId&&b.winnerId===id,lose=b.winnerId&&b.winnerId!==id;
  if(!id||id==='BYE')return `<span class="side tbd"><i class="band ${band}"></i><span class="sd"></span><span class="nmb"><span class="nm">${esc(id==='BYE'?'Bye':srcLabel(x,src))}</span></span></span>`;
  const w=x.wmap[id]||{};
  return `<span class="side ${win?'win':''} ${lose?'lose':''}"><i class="band ${band}"></i><span class="sd">${w.seed>0?w.seed:''}</span><span class="nmb"><span class="nm">${esc(w.name)}</span><span class="sc">${esc(w.school||'')}${w.record?' · '+esc(w.record):''}</span></span></span>`}
function boutBox(x,b){
  if(!b.real){if(b.emptyA&&b.emptyB)return '<div class="bout ghost" aria-hidden="true"></div>';
    const id=b.emptyA?b.pb:b.pa;const fake={pa:id,pb:'BYE',a:b.emptyA?b.b:b.a,b:b.b,winnerId:null};

  const st=b.stale?' stale':'';

let toastT;function toast(msg){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3600)}

function newId(){return 'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

/* ---------- render loop ---------- */
function changed(){C=S.event?ENGINE.compute(S.event,Object.assign({},S.entries,S.drafts),S.results):null;project();

function paintSync(){const c=$('#sync'),t=$('#syncText');c.className='chip';
  if(S.mode==='loading'){t.textContent='Connecting'}else if(S.readOnly){c.classList.add('ro');t.textContent='View only'}
  else if(S.mode==='db'){c.classList.add('live');t.textContent='Live: every device in sync'}else{c.classList.add('local');t.textContent='Saved on this device only'}}

  if(!S.event){$('#evName').textContent='Matside Brackets';$('#evMeta').textContent=S.gotEvent?'No tournament set up yet':'Loading tournament…';return}

  $('#evMeta').textContent=[fmtDate(S.event.date),S.event.venue,`${nW} wrestlers`,`${nB} bouts`,`${done} complete`].filter(Boolean).join(' · ');
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===S.view?'true':'false'));
  const dl=$('#schools');const set=new Set();Object.values(S.entries).forEach(e=>(e.wrestlers||[]).forEach(w=>w.school&&set.add(w.school)));dl.innerHTML=[...set].sort().map(s=>`<option value="${esc(s)}">`).join('')}

function emptyState(){return `<div class="panel empty"><h2>No tournament yet</h2><p>Set up the event, enter wrestlers and seeds for each weight, and the brackets, bout numbers, mat assignments and start times build themselves.</p>
  <div class="row" style="justify-content:center"><button class="btn primary" data-act="goto" data-view="setup" ${DIRECTOR()?'':'disabled'}>Set up a tournament</button><button class="btn" data-act="loadSample" ${DIRECTOR()?'':'disabled'}>Load a sample tournament</button></div></div>`}

/* ---------- Brackets ---------- */
function curWeight(){if(!C||!C.Ws.length)return null;let x=C.byW[S.weight];if(!x){x=C.Ws[0];S.weight=x.w.id}return x}
function weightPills(act){return `<div class="pills" role="group" aria-label="Weight classes">${C.Ws.map(x=>`<button class="pill" data-act="${act}" data-w="${esc(x.w.id)}" aria-pressed="${x.w.id===S.weight}">${esc(x.w.label)}<small>${x.br.n}</small>${act==='pickW'&&x.br.n>1?`<span class="prog" aria-hidden="true"><i style="width:${Math.round(progress(x)*100)}%"></i></span>`:''}</button>`).join('')}</div>`}
function viewBrackets(){const x=curWeight();if(!x)return `<div class="panel empty"><h2>No weight classes</h2><p>Add weight classes in Setup.</p></div>`;

  else if(br.n===1){const w=x.wmap[br.slots[0]];body=`<div class="empty"><p><b>${esc(w.name)}</b> (${esc(w.school)}) is the only entry and wins ${esc(x.w.label)} by default.</p></div>`}
  else{const champCols=[];for(let r=1;r<=br.R;r++){const bs=br.bouts.filter(b=>b.side==='champ'&&b.round===r);champCols.push(`<div class="bcol"><h3>${esc(bs[0].label)}</h3>${bs.map(b=>boutBox(x,b)).join('')}</div>`)}

    body=`<div class="sectionlabel">Championship bracket</div><div class="bscroll"><div class="bwrap"><div class="bgrid" style="--h:${h}px">${champCols.join('')}</div></div></div>
      ${consCols.length?`<div class="sectionlabel">Consolation bracket</div><div class="bscroll"><div class="bwrap"><div class="bgrid" style="--h:${ch}px">${consCols.join('')}</div></div></div>`:''}
      ${place.length?`<div class="sectionlabel">Placement bouts</div><div class="places">${place.map(b=>`<div><div class="label" style="margin-bottom:6px">${esc(b.label)}</div>${boutBox(x,b)}</div>`).join('')}</div>`:''}

/* ---------- Mats ---------- */
function matQueue(m){return C.sched.filter(b=>b.mat===m).map(b=>({b,x:C.byW[b.wid]}))}
/* ---------- Bout sheet ---------- */
function sheetRows(){const f=S.filt;const q=f.q.trim().toLowerCase();
  return C.sched.filter(b=>(!f.mat||b.mat==f.mat)&&(!f.w||b.wid===f.w)&&(!f.status||(f.status==='done'?!!b.result:!b.result))).map(b=>({b,x:C.byW[b.wid]})).filter(({b,x})=>{
    if(!q)return true;const s=[b.pa,b.pb].map(id=>{const w=x.wmap[id];return w?w.name+' '+w.school:''}).join(' ').toLowerCase();return s.includes(q)||String(b.num)===q})}
function viewSheet(){const rows=sheetRows();const mats=Math.max(1,parseInt(S.event.mats)||1);
  const opt=(v,l,cur)=>`<option value="${esc(v)}" ${String(cur)===String(v)?'selected':''}>${esc(l)}</option>`;
  const finalsAt=C.sched.find(b=>b.final);const last=C.sched.slice().sort((p,q)=>projEnd(q)-projEnd(p))[0];

/* ---------- Entries ---------- */
function entryFor(wid){return S.drafts[wid]||S.entries[wid]||{wrestlers:[]}}
function entryWarnings(x,e){const out=[];const ws=e.wrestlers||[];const seeds=ws.filter(w=>w.seed>0).map(w=>+w.seed);
  const dup=seeds.filter((s,i)=>seeds.indexOf(s)!==i);if(dup.length)out.push('Seed '+[...new Set(dup)].join(', ')+' is used more than once.');
  const sorted=[...new Set(seeds)].sort((a,b)=>a-b);sorted.forEach((s,i)=>{if(s!==i+1&&!out.some(o=>o.startsWith('Seeds skip')))out.push('Seeds skip a number. Seeds should run 1, 2, 3 and so on.')});
  if(seeds.some(s=>s>ws.length))out.push('A seed is higher than the number of wrestlers.');
  const un=ws.filter(w=>!(w.seed>0));const draw=e.draw||[];if(un.some(w=>!draw.includes(w.id))&&un.length>1)out.push('Unseeded wrestlers have not been drawn yet. Press "Draw unseeded" before the event.');
  const ss=ENGINE.buildBracket(e,+S.event.placeTo||6);let same=0;ss.bouts.forEach(b=>{if(b.side==='champ'&&b.round===1&&b.real){const A=x.wmap[ss.slots[b.a.i]]||(e.wrestlers||[]).find(w=>w.id===ss.slots[b.a.i]),B=(e.wrestlers||[]).find(w=>w.id===ss.slots[b.b.i]);if(A&&B&&A.school&&A.school===B.school)same++}});
  if(same)out.push(same+' first-round bout'+(same>1?'s':'')+' pair teammates. Redraw or adjust seeds.');
  const nRes=Object.keys(S.results).filter(k=>k.startsWith(x.w.id+'~')).length;if(nRes)out.push(nRes+' result'+(nRes>1?'s are':' is')+' already recorded here. Changing entries or seeds can unseat them.');
  return out}

   <div class="panel-b row"><button class="btn primary" data-act="addW" ${ro}>Add wrestler</button><span class="sub" style="color:var(--muted);font-size:12px">Leave seed blank for unseeded wrestlers. Byes go to the top seeds automatically. Status: scratched and removed wrestlers forfeit their remaining bouts.</span></div></section>

/* ---------- Live mat-side scoring ---------- */
let SB=null,SBT=null,SBH=null;
const PER=()=>ENGINE.periodsFor(S.event);
const SIDE={a:'Green',b:'Red'};
function elapsedOf(c,sec){return Math.min(sec,Math.max(0,(c.base||0)+(c.since?(Date.now()-c.since)/1000:0)))}
function remText(rem,running){if(running&&rem>0&&rem<10)return rem.toFixed(1);return ENGINE.mmss(Math.ceil(rem-1e-6))}
function sbClockText(){const c=SB.sheet.clock,P=PER(),sec=P[c.p].sec;return remText(sec-elapsedOf(c,sec),!!c.since)}
function liveClock(l){const sec=l.sec||120;return remText(sec-elapsedOf(l,sec),!!l.since)}
function sbCtx(){const x=C&&C.byW[SB.wid];const b=x&&x.br.byKey[SB.key];return {x,b}}
function sbBeep(){try{const A=window.AudioContext||window.webkitAudioContext;const ac=sbBeep.ac||(sbBeep.ac=new A());const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=440;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.6)}catch(e){}}
function liveFor(wid,key){for(const [id,l] of Object.entries(S.live||{}))if(l&&l.wid===wid&&l.key===key&&!l.fin)return Object.assign({id},l);return null}

async function openScore(wid,key){if(S.readOnly){toast('This link is view-only. Ask the director for the scorer link to score bouts.');return}
  const x=C.byW[wid];const b=x&&x.br.byKey[key];
  if(!b||!b.real||!b.pa||!b.pb||b.pa==='BYE'||b.pb==='BYE'){toast('Both wrestlers have to be known before this bout can be scored.');return}
  M=null;paintModal();const id=wid+'~'+key;let sh=null;try{sh=await Store.getSheet(id)}catch(e){sh=null}
  if(sh&&(sh.a!==b.pa||sh.b!==b.pb))sh=null;
  if(!sh)sh={wid,key,a:b.pa,b:b.pb,ev:[],clock:{p:0,base:0,since:null},final:null};
  sh=JSON.parse(JSON.stringify(sh));
  SB={id,wid,key,mat:b.mat,sheet:sh,pane:null,pd:{},prior:!!b.result&&!b.result.auto&&!sh.final,saved:!!sh.final};
  const lk=lockOf(b.mat);if(lk)SB.blocked={at:lk.at};else claimMat();
  document.body.classList.add('sbopen');paintSB();
  clearInterval(SBT);SBT=setInterval(sbTick,100);clearInterval(SBH);SBH=setInterval(()=>{if(SB&&!SB.blocked)claimMat(true)},20000)}
function closeScore(){if(SB&&!SB.blocked&&S.mode==='db')Store.setLock(SB.mat,null);SB=null;clearInterval(SBT);SBT=null;clearInterval(SBH);document.body.classList.remove('sbopen');$('#sbRoot').innerHTML='';render()}
function sbTick(){if(!SB)return;const sh=SB.sheet,c=sh.clock,P=PER(),sec=P[c.p].sec;const el=$('#sbClock');if(el)el.textContent=sbClockText();
  const rt=$('#sbRT');if(rt&&(sbTick.n=(sbTick.n||0)+1)%5===0)rt.innerHTML=rtHTML(ENGINE.tally(sh,P,{p:c.p,t:elapsedOf(c,sec)}));
  if(SB.blocked)return;
  if(c.since&&elapsedOf(c,sec)>=sec){c.base=sec;c.since=null;if(!ENGINE.tally(sh,P).ended[c.p])sh.ev.push({k:'PE',p:c.p,t:sec});sbBeep();sbSave();paintSB()}
  if(SB.pane==='timer'){const t=$('#sbTimer');if(t){const d=(Date.now()-SB.pd.since)/1000;t.textContent=ENGINE.mmss(d);const lim=SB.pd.lim,used=SB.pd.used;const r=$('#sbTimerLeft');if(r){const left=lim-used-d;r.textContent=left>=0?ENGINE.mmss(left)+' left':'Over by '+ENGINE.mmss(-left);r.className=left<0?'late':''}}}}
let sbSaveT=null;
function sbSave(){if(!SB||SB.blocked)return;SB.sheet.at=Date.now();const id=SB.id,copy=JSON.parse(JSON.stringify(SB.sheet)),live=sbLiveDoc(),mat=SB.mat;
  clearTimeout(sbSaveT);sbSaveT=setTimeout(()=>{Store.setSheet(id,copy).catch(()=>{});Store.setLive(mat,live).catch(()=>{})},250)}
function sbLiveDoc(){const {x,b}=sbCtx();const P=PER(),c=SB.sheet.clock,T=ENGINE.tally(SB.sheet,P,{p:c.p,t:elapsedOf(c,P[c.p].sec)});const A=x.wmap[SB.sheet.a]||{},B=x.wmap[SB.sheet.b]||{};
  let fin='';if(SB.sheet.final){const r=SB.sheet.final;fin=(r.winner==='a'?A.name:B.name)+' · '+resultText(r)}
  return {wid:SB.wid,key:SB.key,num:b.num,w:x.w.label,round:b.label,an:A.name||'',as:A.school||'',bn:B.name||'',bs:B.school||'',sa:T.a,sb:T.b,pos:T.pos,p:c.p,pl:P[c.p].id,sec:P[c.p].sec,base:c.base||0,since:c.since||null,rt:T.rtAdv||0,style:P.st.id,dev:DEV,fin,at:Date.now()}}
function sbPush(e){const sh=SB.sheet;if(SB.blocked)return;if(SB.saved){toast('This bout is saved as final. Use Undo to reopen it.');return}
  const P=PER(),c=sh.clock;let T=ENGINE.tally(sh,P);if(T.outcome){toast('The bout is already decided. Undo the last action to change it.');return}
  if(!T.started[c.p])sh.ev.push({k:'PS',p:c.p});
  e.p=c.p;if(e.t==null)e.t=Math.floor(elapsedOf(c,P[c.p].sec));sh.ev.push(e);
  T=ENGINE.tally(sh,P);if(T.outcome&&c.since){c.base=elapsedOf(c,P[c.p].sec);c.since=null}
  SB.pane=null;SB.pd={};sbSave();paintSB()}
function sbUndo(){const sh=SB.sheet;if(SB.blocked||!sh.ev.length)return;const e=sh.ev.pop();const P=PER();
  if(e.k==='PS'&&e.p>0){sh.clock={p:e.p-1,base:P[e.p-1].sec,since:null}}
  else if(e.k==='PS'){sh.clock={p:0,base:0,since:null}}
  else if(e.k==='PE'){sh.clock.since=null;sh.clock.base=Math.max(0,P[e.p].sec-1)}
  if(SB.saved){SB.saved=false;sh.final=null;SB.prior=true}
  SB.pane=null;SB.pd={};sbSave();paintSB();toast('Undid: '+sbEventText(e))}
function sbEventText(e){if(ENGINE.MOVES[e.k])return ENGINE.MOVES[e.k].l+' '+ENGINE.MOVES[e.k].pts+(e.s?' '+SIDE[e.s].toLowerCase():'');if(e.k==='P')return ENGINE.PENS[e.pen].l+' on '+SIDE[e.s].toLowerCase();
  return {PS:'period start',PE:'end of period',C:'choice',POS:'position change',F:'fall',INJ:'injury default',TFC:'technical fall',ADJ:'score correction',BT:'blood time',IT:'injury time',RT:'recovery time'}[e.k]||'last action'}
function sbToggleClock(){const sh=SB.sheet,c=sh.clock,P=PER(),per=P[c.p];const T=ENGINE.tally(sh,P);
  if(T.outcome||SB.saved||SB.blocked)return;
  if(T.ended[c.p]){toast('This period is over. Start the next one.');return}
  if(c.since){c.base=elapsedOf(c,per.sec);c.since=null}
  else{if(ENGINE.needsChoice(per,P)&&!sh.ev.some(e=>e.k==='C'&&e.p===c.p&&e.c!=='defer')){SB.pane='choice';SB.pd={s:ENGINE.suggestedChooser(sh,P,T,c.p)};paintSB();return}
    if(!T.started[c.p])sh.ev.push({k:'PS',p:c.p});c.since=Date.now()-0}
  sbSave();paintSB()}
function sbStartPeriod(np){const sh=SB.sheet,P=PER();sh.clock={p:np,base:0,since:null};sh.ev.push({k:'PS',p:np});
  if(ENGINE.needsChoice(P[np],P)){SB.pane='choice';SB.pd={s:ENGINE.suggestedChooser(sh,P,ENGINE.tally(sh,P),np)}}else{SB.pane=null}
  sbSave();paintSB()}
async function sbSaveResult(){const {x,b}=sbCtx();const P=PER(),T=ENGINE.tally(SB.sheet,P);const o=T.outcome;if(!o)return;
  if(b.pa!==SB.sheet.a||b.pb!==SB.sheet.b){toast('The wrestlers in this bout changed after scoring started. Close and score it again.');return}
  const tp=ENGINE.WIN[o.type]||{};const r={a:b.pa,b:b.pb,winner:o.winner,type:o.type,score:tp.s?o.score:'',time:tp.t?(o.time||''):'',at:Date.now(),scored:true};
  const pens={};['a','b'].forEach(s=>{const p=T.pen[s];if(p.US||p.FL)pens[s]={US:p.US||0,FL:p.FL||0}});if(Object.keys(pens).length)r.pens=pens;
  const flag=['a','b'].find(s=>T.pen[s].FL);
  if(flag&&P.st.fam==='folk'){const fid=flag==='a'?b.pa:b.pb;editEntry(x.w.id,e=>{const w=e.wrestlers.find(z=>z.id===fid);if(w)w.status='dq'},true);toast(`${wName(x,fid)} is removed from the tournament for flagrant misconduct. Their remaining bouts are forfeits.`)}
  SB.sheet.final=r;SB.saved=true;SB.prior=false;SB.pane=null;sbSave();paintSB();
  const wn=wName(x,o.winner==='a'?b.pa:b.pb);
  Store.setResult(SB.id,r).then(()=>toast(`Saved: ${wn} wins bout #${b.num}. Bracket updated.`)).catch(()=>{})}
function sbNextBout(){const m=SB.mat;const q=matQueue(m).filter(o=>!o.b.result&&o.b.pa&&o.b.pb&&o.b.pa!=='BYE'&&o.b.pb!=='BYE'&&!(o.x.w.id===SB.wid&&o.b.key===SB.key));
  if(!q.length){toast('No more bouts ready on Mat '+m+'.');closeScore();return}const n=q[0];openScore(n.x.w.id,n.b.key)}

function paintSB(){const root=$('#sbRoot');if(!SB){root.innerHTML='';return}const {x,b}=sbCtx();if(!x||!b){closeScore();return}
  const sh=SB.sheet,P=PER(),c=sh.clock,per=P[c.p],T=ENGINE.tally(sh,P);const running=!!c.since;const st=P.st,folk=st.fam==='folk';const over=!!T.outcome;const perOver=!over&&T.ended[c.p];
  const W={a:x.wmap[sh.a]||{},b:x.wmap[sh.b]||{}};
  const posTag=s=>T.pos==='N'?'Neutral':T.pos===s?'Top':'Bottom';
  const dim=(s,k)=>{if(!folk)return false;if(T.pos==='N')return k!=='T';const top=T.pos===s;if(k==='T')return true;if(k==='E'||k==='R')return top;return !top};
  const penSummary=s=>{const p=T.pen[s];const parts=[];if(p.ST)parts.push('Stall '+p.ST);if(p.CA)parts.push('Caution '+p.CA);if(p.TV)parts.push('Tech/illegal '+p.TV);if(p.US)parts.push('Unsport '+p.US);if(p.UC)parts.push('Cautions '+p.UC);if(p.CH)parts.push('Challenges lost '+p.CH);return parts.join(' · ')};
  const tmr=(s,k,l,lim)=>{const u=T.time[s][k];return `<button class="tbtn ${lim&&u>lim?'over':''}" data-act="sbTimer" data-s="${s}" data-k="${k}" ${over||SB.saved||SB.blocked?'disabled':''}><span>${l}</span><b>${ENGINE.mmss(u)}</b><small>${lim?'/ '+ENGINE.mmss(lim):'no limit'}</small></button>`};
  const side=s=>{const w=W[s];const lock=over||SB.saved||!!SB.blocked;
    return `<section class="sbs ${s==='a'?'g':'r'} ${over&&T.outcome.winner===s?'won':''}" aria-label="${SIDE[s]}">
     <header><div class="who"><span class="label">${SIDE[s]}${w.seed>0?' · Seed '+w.seed:''}</span><span class="nm">${esc(w.name||'')}</span><span class="sc">${esc(w.school||'')}</span></div>${folk?`<span class="postag">${posTag(s)}</span>`:''}</header>
     <div class="big" aria-live="polite">${T[s]}</div>
     <div class="pensum">${esc(penSummary(s))||'&nbsp;'}</div>
     <div class="acts ${folk?'':'u'}">${st.moves.map(k=>{const mv=ENGINE.MOVES[k];return `<button class="act ${dim(s,k)?'dim':''}" data-act="sbMove" data-s="${s}" data-m="${k}" ${lock?'disabled':''}><b>${mv.b}</b><small>${mv.l}${k[0]==='N'?' '+mv.pts:''}</small></button>`}).join('')}</div>
     <div class="acts two"><button class="act pen" data-act="sbPenOpen" data-s="${s}" ${lock?'disabled':''}><b>Penalty</b><small>${folk?'Stall, caution, illegal…':'Caution, lost challenge'}</small></button><button class="act fall" data-act="sbFallAsk" data-s="${s}" ${lock?'disabled':''}><b>Fall</b><small>Pin</small></button></div>
     <div class="tmrs">${Object.entries(st.timers).map(([k,lim])=>tmr(s,k,{BT:'Blood',IT:'Injury',RT:'Recovery'}[k],lim)).join('')}</div>
     ${T.time[s].IT>st.timers.IT&&!over?`<div class="sbwarn">Injury time is used up. If ${esc(w.name||SIDE[s])} can't continue, award an injury default under More.</div>`:''}
    </section>`};
  /* center pane */
  let pane='';
  if(SB.blocked){const ago=Math.max(0,Math.round((Date.now()-(SB.blocked.at||0))/1000));
    pane=`<div class="sbpane"><div class="label">Mat ${SB.mat} is scored on another device</div><p>${SB.blocked.taken?'Another device took over this mat.':`Another device is scoring Mat ${SB.mat} (last active ${ago<60?ago+' seconds':Math.round(ago/60)+' minutes'} ago).`} Scoring here too would overwrite it, so this scoreboard is read-only.</p>
     <div class="row"><button class="btn" data-act="sbWatch">Watch on Live tab</button><button class="btn danger" data-act="sbTakeOver">Take over this mat</button></div><p class="sub">Take over only if the other device is closed or broken. It continues from the last saved scoresheet.</p></div>`}
  else if(SB.pane==='choice'){const ch=SB.pd.s;const cn=s=>esc((W[s].name||SIDE[s]).split(' ').slice(-1)[0]);
    pane=`<div class="sbpane"><div class="label">${esc(per.l)} choice</div>
     <div class="seg">${['a','b'].map(s=>`<button data-act="sbChooser" data-s="${s}" aria-pressed="${ch===s}" class="${s==='a'?'g':'r'}">${SIDE[s]} chooses<small>${cn(s)}</small></button>`).join('')}</div>
     ${ch?`<div class="seg four">${['top','bottom','neutral'].concat(per.id==='P2'&&!SB.pd.noDefer?['defer']:[]).map(cc=>`<button data-act="sbChoice" data-c="${cc}">${cc[0].toUpperCase()+cc.slice(1)}</button>`).join('')}</div>`:`<p class="sub">${per.id==='P2'?'Who won the disc toss?':'Pick who has choice.'}</p>`}
     <button class="btn ghost" data-act="sbPaneClose">Skip</button></div>`}
  else if(SB.pane==='pen'){const s=SB.pd.s,o=ENGINE.otherSide(s);
    pane=`<div class="sbpane"><div class="label">Penalty on <span class="${s==='a'?'wg':'wr'}">${SIDE[s]}</span> · ${esc(W[s].name||'')}</div><div class="penlist">
     ${st.pens.map(k=>[k,ENGINE.PENS[k]]).map(([k,v])=>{const n=T.pen[s][v.g]||0;const stp=ENGINE.penStep(v.g,n,k);const nx=stp==='DQ'?'<b class="late">Disqualification</b>':stp?`+${stp} ${SIDE[o].toLowerCase()}`:v.g==='ST'?'Warning':'No points yet';
       return `<button data-act="sbPen" data-k="${k}"><span>${v.l}</span><small>${n?n+' so far · ':''}next: ${nx}</small></button>`}).join('')}</div>
     <button class="btn ghost" data-act="sbPaneClose">Cancel</button></div>`}
  else if(SB.pane==='fall'||SB.pane==='inj'){const s=SB.pd.s;const t=ENGINE.matchTime(P,c.p,Math.floor(elapsedOf(c,per.sec)));
    pane=`<div class="sbpane"><div class="label">${SB.pane==='fall'?'Confirm fall':'Confirm injury default'}</div><p>${SB.pane==='fall'?`<b>${esc(W[s].name)}</b> pins <b>${esc(W[ENGINE.otherSide(s)].name)}</b> at <b class="mono">${t}</b> match time.`:`<b>${esc(W[s].name)}</b> cannot continue. <b>${esc(W[ENGINE.otherSide(s)].name)}</b> wins by injury default at <b class="mono">${t}</b>.`}</p>

document.addEventListener('click',async ev=>{if(!SB)return;const t=ev.target.closest('[data-act]');if(!t||!t.dataset.act.startsWith('sb'))return;const a=t.dataset.act,s=t.dataset.s;const sh=SB.sheet,P=PER(),c=sh.clock;
  if(SB.blocked&&!['sbClose','sbWatch','sbTakeOver'].includes(a))return;

  case 'sbWatch':closeScore();S.view='live';savePrefs();paintHeader();render();break;
  case 'sbTakeOver':{const fresh=await Store.getSheet(SB.id).catch(()=>null);const {b}=sbCtx();if(fresh&&fresh.a===b.pa&&fresh.b===b.pb){SB.sheet=JSON.parse(JSON.stringify(fresh));SB.saved=!!fresh.final}SB.blocked=null;claimMat();paintSB();toast('You are scoring Mat '+SB.mat+' now.');break}
  case 'sbClose':closeScore();break;
  case 'sbMove':sbPush({k:t.dataset.m,s});break;
  case 'sbPenOpen':SB.pane='pen';SB.pd={s};paintSB();break;

  case 'sbFallAsk':SB.pane='fall';SB.pd={s};paintSB();break;
  case 'sbFall':sbPush({k:'F',s});break;
  case 'sbInjAsk':SB.pane='inj';SB.pd={s};paintSB();break;
  case 'sbInj':sbPush({k:'INJ',s});break;
  case 'sbTF':sbPush({k:'TFC'});break;
  case 'sbClockBtn':sbToggleClock();break;
  case 'sbNudge':{const sec=P[c.p].sec;c.base=Math.min(sec,Math.max(0,(c.base||0)-(+t.dataset.v)));sbSave();paintSB();break}
  case 'sbStartPer':sbStartPeriod(+t.dataset.p);break;
  case 'sbChooser':SB.pd.s=s;paintSB();break;
  case 'sbChoice':{const cc=t.dataset.c,who=SB.pd.s;const T=ENGINE.tally(sh,P);if(!T.started[c.p])sh.ev.push({k:'PS',p:c.p});
    sh.ev.push({k:'C',s:who,c:cc,p:c.p,t:0});if(cc==='defer'){SB.pd={s:ENGINE.otherSide(who),noDefer:true}}else{SB.pane=null;SB.pd={}}sbSave();paintSB();break}
  case 'sbPos':sbPush({k:'POS',v:t.dataset.v});break;
  case 'sbAdj':sbPush({k:'ADJ',s,v:+t.dataset.v});break;
  case 'sbEndPer':{const sec=P[c.p].sec;c.base=sec;c.since=null;const T=ENGINE.tally(sh,P);if(!T.started[c.p])sh.ev.push({k:'PS',p:c.p});sh.ev.push({k:'PE',p:c.p,t:sec});SB.pane=null;sbSave();paintSB();break}
  case 'sbSetClockAsk':SB.pane='setclock';paintSB();setTimeout(()=>{const i=$('#sbClockIn');if(i){i.focus();i.select()}},30);break;
  case 'sbSetClock':{const v=($('#sbClockIn')||{}).value||'';const m=/^(\d{1,2})(?::(\d{1,2}))?$/.exec(v.trim());if(!m){toast('Enter time left like 1:23.');return}const rem=m[2]!=null?(+m[1])*60+(+m[2]):+m[1];const sec=P[c.p].sec;
    c.base=Math.min(sec,Math.max(0,sec-rem));if(c.since)c.since=Date.now();SB.pane=null;sbSave();paintSB();break}
  case 'sbTimer':{if(c.since){c.base=elapsedOf(c,P[c.p].sec);c.since=null}const T=ENGINE.tally(sh,P);const k=t.dataset.k;SB.pane='timer';SB.pd={s,k,since:Date.now(),lim:{BT:300,IT:90,RT:120}[k],used:T.time[s][k]};sbSave();paintSB();break}
  case 'sbTimerDone':{const d=SB.pd;const sec=Math.round((Date.now()-d.since)/1000);if(sec>0)sbPush({k:d.k,s:d.s,sec});else{SB.pane=null;paintSB()}break}
  case 'sbUndo':sbUndo();break;
  case 'sbMore':SB.pane=SB.pane==='more'?null:'more';paintSB();break;

document.addEventListener('keydown',e=>{if(!SB)return;const tag=(document.activeElement||{}).tagName;if(/INPUT|TEXTAREA|SELECT/.test(tag)){if(e.key==='Enter'&&document.activeElement.id==='sbClockIn'){e.preventDefault();$('[data-act="sbSetClock"]').click()}return}

function paintLiveTags(){document.querySelectorAll('#main .bout[data-k]').forEach(el=>{const l=liveFor(el.dataset.w,el.dataset.k);let tag=el.querySelector('.lv');
  if(!l){if(tag)tag.remove();return}if(!tag){tag=document.createElement('span');tag.className='rs lv';el.appendChild(tag)}
